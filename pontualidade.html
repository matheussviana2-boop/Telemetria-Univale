<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Univale · Pontualidade de Viagens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Poppins:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --ink:#0A2E2C; --ink-2:#123F3C; --steel:#587572; --line:#D8E4E2;
  --bg:#EDF4F3; --card:#FFFFFF; --soft:#F3F9F8;
  --ok:#17795E; --warn:#B77500; --late:#C4291A; --mark:#0E8880;
  --mark-soft:#E1F4F1;
  --teal:#16AFA6; --teal-dark:#0B7771; --teal-mid:#0E8F87; --red:#E42313;
  --r:6px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:14px; line-height:1.45;
}
h1,h2,h3,.brand-text strong{font-family:"Poppins",sans-serif;letter-spacing:.01em}
.mono,td.t,.kpi-v{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button,select,input{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- topo / assinatura Univale ---------- */
header{
  position:relative;overflow:hidden;
  background:linear-gradient(120deg,#0A9F99 0%,#0CA7A0 52%,#10B0A8 100%);
  color:#fff;padding:12px 22px 13px;display:flex;flex-direction:column;gap:10px;
}
header::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(120deg,rgba(255,255,255,.08) 0 2px,transparent 2px 26px);
}
header::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--red),#ff8a3d 35%,var(--red) 70%);
}
.header-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px;min-width:320px}
.brand-logo{
  width:176px;height:64px;overflow:hidden;flex:none;
  background:transparent;border:0;box-shadow:none;border-radius:0;
}
.brand-logo img{width:100%;height:100%;display:block;object-fit:cover;object-position:center}
.brand-text{display:flex;flex-direction:column;justify-content:center;line-height:1.05}
.brand-text strong{font-size:16px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:#F3FFFD}
header .spacer{flex:1}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.stamp-block{text-align:left;line-height:1.3;padding-right:2px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.chk{display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.85);cursor:default;user-select:none;position:relative}
.chk input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.chk .box{
  display:inline-block;flex:0 0 auto;width:14px;height:14px;border-radius:3px;position:relative;
  border:1.5px solid rgba(255,255,255,.6);background:rgba(255,255,255,.08);
}
.chk input:checked + .box{background:#E5343B;border-color:#E5343B;box-shadow:0 0 0 1px rgba(255,255,255,.3) inset}
.chk input:checked + .box::after{
  content:'';position:absolute;left:3px;top:-1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
}
.chk input:checked ~ .lbl{color:#fff;font-weight:600}
.chk .lbl{white-space:nowrap}
.stamp-date{font-size:11px;color:rgba(255,255,255,.76);font-weight:600;margin-top:2px}
.stamp-date b{font-family:"IBM Plex Mono",monospace;color:#fff;font-weight:700;font-size:13px}

/* ---------- upload (discreto, só o essencial) ---------- */
.drops{display:flex;flex-wrap:wrap;gap:6px;position:relative;z-index:1;justify-content:flex-end}
.drop{
  background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.35);border-radius:5px;
  padding:4px 8px;display:flex;gap:6px;align-items:center;cursor:pointer;transition:.15s;min-height:38px;
}
.drop:hover,.drop.over{border-color:#fff;background:rgba(255,255,255,.16)}
.drop.loaded{border-style:solid;border-color:#7FE0C4;background:rgba(255,255,255,.12)}
.drop .num{font-family:"IBM Plex Mono",monospace;font-size:11px;color:rgba(255,255,255,.6);font-weight:600}
.drop.loaded .num{color:#7FE0C4}
.drop .t1{font-weight:600;font-size:11px;color:#fff}
.drop .t2{color:rgba(255,255,255,.7);font-size:10px}
.drop input{display:none}
.btn-todos{
  background:#fff;border:1px solid #fff;border-radius:5px;color:#0E6B62;font-weight:700;font-size:12px;
  padding:0 14px;min-height:38px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn-todos:hover{background:#E8FBF6}
.btn-limpar{
  background:transparent;border:1px solid rgba(255,255,255,.55);border-radius:5px;color:#fff;font-weight:600;font-size:12px;
  padding:0 14px;min-height:38px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn-limpar:hover{background:rgba(255,255,255,.14);border-color:#fff}
.empty-state{
  max-width:560px;margin:28px auto;text-align:center;padding:0;
}
.empty-state p{margin:0;font-size:13px;line-height:1.6;color:#6B8985}
.empty-state b{color:#0E6B62;font-weight:600}

.wrap{max-width:1820px;margin:0 auto;padding:18px 16px 60px}

/* ---------- controles ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:16px 0 12px}
.filters{
  flex:1;min-width:320px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;
  background:linear-gradient(180deg,#FFFFFF 0%,#F5FAF9 100%);
  border:1px solid #D9E8E5;border-radius:12px;padding:12px 14px;
  box-shadow:0 10px 24px rgba(10,46,44,.06);
}
.field{display:flex;flex-direction:column;gap:5px;min-width:190px}
.field.grow{flex:1;min-width:280px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);font-weight:700}
.field input,.field select{
  height:40px;border:1px solid #C7DAD6;border-radius:10px;background:#fff;color:var(--ink);
  padding:0 12px;outline:none;transition:border-color .15s, box-shadow .15s;
}
.field input::placeholder{color:#8AA3A0}
.field input:focus,.field select:focus{border-color:#0E9B93;box-shadow:0 0 0 3px rgba(23,182,172,.15)}
.bar{display:flex;gap:10px;justify-content:flex-end;align-items:center;align-self:center;flex-wrap:wrap}
.export-option{display:flex;align-items:center;gap:8px;padding:0 4px;font-size:12px;color:var(--steel);font-weight:600;white-space:nowrap;cursor:pointer}
.export-option input{width:16px;height:16px;accent-color:var(--teal-dark);cursor:pointer}
.btn{background:var(--teal-dark);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;box-shadow:0 8px 18px rgba(11,122,115,.18);height:40px;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{background:var(--ink)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--soft)}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- kpis ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,340px));justify-content:center;gap:14px;background:none;border:0;overflow:visible;margin-bottom:16px}
.kpi{
  position:relative;background:linear-gradient(180deg,#FFFFFF 0%,#F6FBFA 100%);
  padding:14px 16px 12px;border:1px solid #D9E8E5;border-radius:14px;text-align:center;
  box-shadow:0 10px 24px rgba(10,46,44,.06);overflow:hidden;
  min-height:108px;display:flex;flex-direction:column;justify-content:center;
  cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;
}
.kpi:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(10,46,44,.10);border-color:#B9D7D2}
.kpi.active{border-color:#0E9B93;box-shadow:0 0 0 3px rgba(23,182,172,.14),0 12px 28px rgba(10,46,44,.09)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,#0B7A73,#19B7AD)}
.kpi:nth-child(2)::before{background:linear-gradient(90deg,#0B8A7E,#7CCFA7)}
.kpi:nth-child(3)::before{background:linear-gradient(90deg,#B77500,#F0C15B)}
.kpi-l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--steel);font-weight:700;margin-bottom:8px}
.kpi-v{font-size:30px;font-weight:700;line-height:1;color:var(--ink);margin-bottom:8px}
.kpi-s{font-size:12px;color:var(--steel);line-height:1.35}

/* ---------- tabela ---------- */
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:auto;max-height:70vh}
table{border-collapse:separate;border-spacing:0;font-size:13px;line-height:1.25;table-layout:fixed;width:1960px;max-width:none;margin:0 auto}
thead th{
  position:sticky;z-index:2;background:#105B56;color:#F1FBFA;text-align:center;
  padding:8px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;white-space:nowrap;
}
thead tr:first-child th{top:0}
thead tr:nth-child(2) th{top:30px}
thead th.sub{cursor:pointer;border-top:1px solid rgba(255,255,255,.16)}
thead th.sub:hover{filter:brightness(1.08)}
.colicon{display:inline-flex;align-items:center;cursor:help;vertical-align:middle}
.colicon svg{display:block}
thead th.grp{letter-spacing:.12em;color:#E8FAF8;padding:7px 10px}
thead th.grp.g0,thead th.sub.g0{background:#115E59}
thead th.grp.g1,thead th.sub.g1{background:#176D67}
thead th.grp.g2,thead th.sub.g2{background:#1D7B74}
thead th.grp.g3,thead th.sub.g3{background:#0E6B62}
thead th.grp.g4,thead th.sub.g4{background:#286F6A}
thead th.group-start{box-shadow:inset 2px 0 0 rgba(255,255,255,.42)}
tbody td.marca{background:#F1FAF9}
tbody tr:hover td.marca{background:#E4F5F3}
tbody tr.no-hit td.marca{background:#FCF4F2}
td.marca .pt{color:var(--mark);font-weight:600;min-width:0;flex:0 1 auto}
.ptline{display:flex;align-items:center;justify-content:center;gap:5px;max-width:100%}
tbody td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}
tbody td.left{text-align:left}
tbody td.brk{white-space:normal;word-break:break-word}
tbody tr:hover{background:var(--soft)}
tbody tr.no-hit{background:#FCF6F4}
tbody tr.no-hit:hover{background:#F8EDE9}
td.t{font-size:12.5px}
.sec{color:var(--steel);font-size:11.5px}
.pt{font-size:11.5px;color:var(--steel);max-width:100%;overflow:hidden;text-overflow:ellipsis;display:block;margin:0 auto}
td.left .pt{margin:0}
.pill{display:inline-block;padding:1px 6px;border-radius:9px;font-size:11px;font-weight:600;white-space:nowrap}
.p-ok{background:#E4F2ED;color:var(--ok)}
.p-warn{background:#FBF0DC;color:var(--warn)}
.p-late{background:#FBE4E0;color:var(--late)}
.p-none{background:#EDF0F1;color:var(--steel)}
.p-mark{background:var(--mark-soft);color:var(--mark)}
.dash{color:#B9C4CA}

.empty{padding:60px 20px;text-align:center;color:var(--steel)}
.note{font-size:12.5px;color:var(--steel);margin-top:10px}
.err{background:#FBE4E0;color:var(--late);border:1px solid #F0C4BC;border-radius:var(--r);padding:10px 12px;margin:12px 0;font-size:13px}
@media (max-width:900px){
  header{padding:10px 12px 12px}
  .header-top{align-items:flex-start}
  .brand{min-width:0;width:100%}
  .brand-logo{width:165px;height:60px}
  .brand-text strong{font-size:14px}
  .header-actions{width:100%;justify-content:space-between}
  .stamp-block{text-align:left;align-items:flex-start}
  .drops{justify-content:flex-start}
}
@media (max-width:920px){
  .toolbar{align-items:stretch}
  .filters{width:100%}
  .bar{width:100%;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<!-- ============ CORE:START (lógica pura, sem DOM) ============ -->
<script id="core">
/* ---------- normalizações ---------- */
function normFrota(v){
  if(v==null) return '';
  return String(v).toUpperCase().replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
}
function normTexto(v){
  if(v==null) return '';
  return String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
}
function nomePonto(v){ // "PONTUALIDADE_X : PONTUALIDADE_X[744]" -> "PONTUALIDADE_X"
  if(v==null) return '';
  return String(v).split(':')[0].trim();
}
function nomeMotorista(v){ // "356255:BRENO COTA SOARES" -> "BRENO COTA SOARES"
  if(v==null) return '';
  var s=String(v).trim();
  var i=s.indexOf(':');
  if(i>=0 && /^\d+$/.test(s.slice(0,i).trim())) s=s.slice(i+1);
  return s.trim();
}
function ehPontoPontualidade(v){
  var t=normTexto(v);
  return t.indexOf('PONTUALIDA')>=0; // cobre PONTUALIDADE e o typo PONTUALIDAE
}
/* motoristas batem? aceita nomes abreviados ("PAULO HENRI. MOREIRA") */
function semMotorista(v){
  var t=normTexto(v);
  return !t || t.indexOf('VAGO')>=0 || t.indexOf('NAO LOGADO')>=0 || t==='N/A' || t==='[N/A]';
}
function motoristaBate(a,b){
  if(semMotorista(a)||semMotorista(b)) return true;
  var A=normTexto(a).replace(/\./g,' ').split(/\s+/).filter(Boolean);
  var B=normTexto(b).replace(/\./g,' ').split(/\s+/).filter(Boolean);
  if(!A.length||!B.length) return true;
  var casa=function(x,y){ var n=Math.min(x.length,y.length); return n>=3 && x.slice(0,n)===y.slice(0,n); };
  var prim=casa(A[0],B[0]);
  var ult=casa(A[A.length-1],B[B.length-1]);
  return prim||ult;
}

/* ---------- datas ---------- */
function arredSeg(d){ // serial do Excel chega com fração de ms; o relatório trabalha em segundos
  if(!d||isNaN(d.getTime())) return null;
  return new Date(Math.round(d.getTime()/1000)*1000);
}
function parseData(v){
  if(v==null||v===''||v===false||v===true) return null;
  if(v && typeof v.getTime==='function') return arredSeg(new Date(v.getTime()));
  if(typeof v==='number'){ // serial do Excel: sempre lido como hora de relógio
    if(v<=0||v>200000) return null;
    var ms=Math.round(v*86400000);
    var dias=Math.floor(ms/86400000), resto=Math.round((ms-dias*86400000)/1000);
    if(resto>=86400){dias++;resto-=86400;}
    var base=new Date(Date.UTC(1899,11,30)+dias*86400000);
    return new Date(base.getUTCFullYear(),base.getUTCMonth(),base.getUTCDate(),
                    Math.floor(resto/3600),Math.floor(resto%3600/60),resto%60);
  }
  var s=String(v).trim();
  if(!s||/^(false|true|n\/d|n\/a|-)$/i.test(s)) return null;
  var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})[ T]+(\d{1,2}):(\d{2})(?::(\d{2}))?/); // dd/mm/aa hh:mm[:ss]
  if(m){
    var ano=+m[3]; if(ano<100) ano+= (ano<70?2000:1900);
    return new Date(ano,+m[2]-1,+m[1],+m[4],+m[5],+(m[6]||0));
  }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?/); // aaaa-mm-dd hh:mm[:ss]
  if(m) return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){ var a2=+m[3]; if(a2<100) a2+=(a2<70?2000:1900); return new Date(a2,+m[2]-1,+m[1]); }
  var d2=new Date(s);
  return isNaN(d2.getTime())?null:d2;
}
function hhmm(d){ if(!d) return null;
  var p=function(n){return (n<10?'0':'')+n};
  return p(d.getHours())+':'+p(d.getMinutes());
}
function ddmm(d){ if(!d) return null;
  var p=function(n){return (n<10?'0':'')+n};
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
}
function dur(a,b){
  if(!a||!b) return null;
  var s=Math.round((b-a)/1000); var neg=s<0; s=Math.abs(s);
  var p=function(n){return (n<10?'0':'')+n};
  return (neg?'-':'')+p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60);
}

/* ---------- localizar colunas ---------- */
function acharCol(cols,alvos){
  var norm=cols.map(function(c){return normTexto(c)});
  for(var i=0;i<alvos.length;i++){
    var a=normTexto(alvos[i]);
    var k=norm.indexOf(a);
    if(k>=0) return cols[k];
  }
  return null;
}
function tipoPlanilha(cols){
  var n=cols.map(normTexto);
  if(n.indexOf('CODIGO CARTAO')>=0 || (n.indexOf('CARRO')>=0 && n.indexOf('HORA')>=0 && n.indexOf('TIPO')>=0 && n.indexOf('DATA')>=0 && n.indexOf('H.PROG')<0)) return 'passagens';
  if(n.indexOf('ZONA/PONTO')>=0 || (n.indexOf('RECEBIDA EM')>=0 && n.indexOf('FROTA')>=0)) return 'eventos';
  if(n.indexOf('H.PROG')>=0 || (n.indexOf('CARRO')>=0 && n.indexOf('ITINERARIO')>=0)) return 'viagens';
  return null;
}

/* ---------- preparar eventos ---------- */
function prepararEventos(linhas){
  var out=[];
  if(!linhas.length) return out;
  var cols=Object.keys(linhas[0]);
  var cZona=acharCol(cols,['Zona/Ponto','Zona / Ponto','Ponto']);
  var cRec =acharCol(cols,['Recebida em','Registrada em','Data','Data/Hora']);
  var cReg =acharCol(cols,['Registrada em','Recebida em']);
  var cFro =acharCol(cols,['Frota','Carro','Veículo','Veiculo']);
  var cCha =acharCol(cols,['Chapa','Placa']);
  var cMot =acharCol(cols,['Motorista']);
  var cNome=acharCol(cols,['Nome','Evento']);
  var cOper=acharCol(cols,['Operadora']);
  for(var i=0;i<linhas.length;i++){
    var r=linhas[i];
    if(!ehPontoPontualidade(r[cZona])) continue;
    var d=parseData(r[cRec]) || parseData(r[cReg]);
    if(!d) continue;
    var nm=normTexto(r[cNome]);
    var tipo = nm.indexOf('VOLTA')>=0 ? 'entrada' : (nm.indexOf('SAIDA')>=0 ? 'saida' : 'outro');
    out.push({
      dt:d, ts:d.getTime(), tipo:tipo, evento:String(r[cNome]==null?'':r[cNome]),
      ponto:nomePonto(r[cZona]), zona:String(r[cZona]==null?'':r[cZona]),
      frota:String(r[cFro]==null?'':r[cFro]), frotaN:normFrota(r[cFro]),
      chapa:cCha?String(r[cCha]==null?'':r[cCha]):'',
      motorista:nomeMotorista(cMot?r[cMot]:''),
      operadora:cOper?String(r[cOper]==null?'':r[cOper]):''
    });
  }
  out.sort(function(a,b){return a.ts-b.ts});
  return out;
}

/* ---------- preparar passagens de cartão (passageiros) ---------- */
function prepararPassagens(linhas,origem){
  var out=[];
  if(!linhas.length) return out;
  var cols=Object.keys(linhas[0]);
  var cCarro=acharCol(cols,['Carro','Frota','Veículo','Veiculo']);
  var cChapa=acharCol(cols,['Chapa','Placa']);
  var cData =acharCol(cols,['Data']);
  var cHora =acharCol(cols,['Hora']);
  var cTipo =acharCol(cols,['Tipo']);
  var cCod  =acharCol(cols,['Código Cartão','Codigo Cartao','Cartão','Cartao']);
  var carroAtual='', chapaAtual=''; // muitos exports só preenchem Carro/Chapa na 1ª linha de cada bloco
  for(var i=0;i<linhas.length;i++){
    var r=linhas[i];
    var carroCel=cCarro?r[cCarro]:null;
    if(carroCel!=null && String(carroCel).trim()!=='') carroAtual=String(carroCel).trim();
    var chapaCel=cChapa?r[cChapa]:null;
    if(chapaCel!=null && String(chapaCel).trim()!=='') chapaAtual=String(chapaCel).trim();
    var tipo=normTexto(cTipo?r[cTipo]:'');
    if(cTipo && tipo && tipo.indexOf('PASSAGEIRO')<0) continue; // ignora eventos que não são embarque de passageiro
    var dataStr=cData?r[cData]:null, horaStr=cHora?r[cHora]:null;
    var d=null;
    if(dataStr!=null && horaStr!=null){
      d=parseData(String(dataStr)+' '+String(horaStr));
    }
    if(!d) d=parseData(dataStr)||parseData(horaStr);
    if(!d) continue;
    out.push({
      dt:d, ts:d.getTime(),
      carro:carroAtual, carroN:normFrota(carroAtual),
      chapa:chapaAtual,
      cartao:cCod?String(r[cCod]==null?'':r[cCod]):'',
      origem:origem||''
    });
  }
  out.sort(function(a,b){return a.ts-b.ts});
  return out;
}

/* ---------- preparar viagens ---------- */
function prepararViagens(linhas){
  var out=[];
  if(!linhas.length) return out;
  var cols=Object.keys(linhas[0]);
  var g=function(a){return acharCol(cols,a)};
  var c={
    id:g(['id','Id','ID','Viagem']), status:g(['Status']), carro:g(['Carro','Frota','Veículo']),
    p0:g(['Ponto']), prog0:g(['H.Prog']), real0:g(['H.Real']), res0:g(['Res.Partida']),
    p1:g(['Ponto.1','Ponto_1','Ponto 1','Ponto final']),
    prog1:g(['H.Prog.1','H.Prog_1','H.Prog 1']),
    real1:g(['H.Real.1','H.Real_1','H.Real 1']), res1:g(['Res.Chegada']),
    fim:g(['H.Final']), mot:g(['Motorista']), oper:g(['Operadora']), cli:g(['Cliente']),
    linha:g(['Linha']), it:g(['Itinerário','Itinerario','Nome']), tipo:g(['Tipo']),
    cc:g(['Centro de Custo']), km:g(['Km']), grupo:g(['Grupo']), obs:g(['obs','Obs','Observação','Observacao'])
  };
  for(var i=0;i<linhas.length;i++){
    var r=linhas[i];
    var ini=parseData(r[c.real0]), fim=parseData(r[c.fim])||parseData(r[c.real1]);
    var pini=parseData(r[c.prog0]), pfim=parseData(r[c.prog1]);
    var carro=String(r[c.carro]==null?'':r[c.carro]).trim();
    if(!carro && !pini) continue;
    out.push({
      id:c.id?r[c.id]:null, status:String(r[c.status]==null?'':r[c.status]).trim(),
      carro:carro, carroN:normFrota(carro),
      ponto0:nomePonto(r[c.p0]), prog0:pini, real0:ini, res0:String(r[c.res0]==null?'':r[c.res0]),
      ponto1:nomePonto(r[c.p1]), prog1:pfim, real1:parseData(r[c.real1]), res1:String(r[c.res1]==null?'':r[c.res1]),
      fim:fim, motorista:nomeMotorista(r[c.mot]),
      operadora:String(r[c.oper]==null?'':r[c.oper]).trim(),
      linha:String(r[c.linha]==null?'':r[c.linha]).trim(),
      itinerario:String(r[c.it]==null?'':r[c.it]).trim(),
      tipo:String(r[c.tipo]==null?'':r[c.tipo]).trim(),
      cc:String(r[c.cc]==null?'':r[c.cc]).trim(),
      km:r[c.km]==null?'':r[c.km],
      obs:c.obs?String(r[c.obs]==null?'':r[c.obs]).trim():''
    });
  }
  return out;
}

/* ---------- cruzamento ---------- */
function ehIda(tipo){
  var t=normTexto(tipo);
  return t==='IDA' || t.indexOf('IDA')===0; // cobre variações tipo "Ida" vindas da planilha
}

/* ---------- localizar linha de cabeçalho (alguns exports trazem um título na linha 1) ---------- */
var VOCAB_CABECALHO=['ID','STATUS','CARRO','FROTA','VEICULO','CHAPA','PLACA','DATA','HORA','TIPO',
  'H.PROG','H.REAL','ZONA/PONTO','RECEBIDA EM','REGISTRADA EM','CODIGO CARTAO','CARTAO','NOME',
  'OPERADORA','MOTORISTA','LINHA','ITINERARIO','PONTO','RES.PARTIDA','RES.CHEGADA','H.FINAL','OBS'];
function pareceCabecalho(linha){
  var n=0;
  for(var i=0;i<linha.length;i++){
    var v=linha[i];
    if(v==null||v==='') continue;
    if(VOCAB_CABECALHO.indexOf(normTexto(v))>=0) n++;
  }
  return n;
}
function linhasComCabecalhoAuto(matriz){
  if(!matriz||!matriz.length) return [];
  var limite=Math.min(matriz.length,10);
  var melhorIdx=0, melhorScore=-1;
  for(var i=0;i<limite;i++){
    var score=pareceCabecalho(matriz[i]||[]);
    if(score>melhorScore){ melhorScore=score; melhorIdx=i; }
  }
  if(melhorScore<2) melhorIdx=0; // não achou nada parecido com cabeçalho: assume a 1ª linha mesmo
  var cabBruto=matriz[melhorIdx]||[];
  // dedup igual ao SheetJS: nomes repetidos viram "Nome_1","Nome_2",... (partida/chegada usam o mesmo nome de coluna)
  var vistos={}, cab=[];
  for(var c=0;c<cabBruto.length;c++){
    var nome=(cabBruto[c]==null||cabBruto[c]==='')?('__EMPTY_'+c):String(cabBruto[c]);
    if(vistos[nome]==null){ vistos[nome]=0; cab.push(nome); }
    else{ vistos[nome]++; cab.push(nome+'_'+vistos[nome]); }
  }
  var out=[];
  for(var r=melhorIdx+1;r<matriz.length;r++){
    var linha=matriz[r];
    if(!linha) continue;
    var vazio=true, obj={};
    for(var cc=0;cc<cab.length;cc++){
      var val=(linha[cc]===undefined)?null:linha[cc];
      if(val!=null && val!=='') vazio=false;
      obj[cab[cc]]=val;
    }
    if(!vazio) out.push(obj);
  }
  return out;
}
function cruzar(viagens,eventos,opt){
  opt=opt||{};
  var tolMs=(opt.tolerancia==null?5:opt.tolerancia)*60000;
  var filtroTipo=opt.tipoEvento||'entrada';           // entrada | saida | qualquer
  var qual=opt.passagem||'primeira';                   // primeira | ultima
  var apenasIda=opt.apenasIda!==false;                  // pontualidade só se aplica à ida (portaria de saída)
  if(apenasIda) viagens=viagens.filter(function(t){return ehIda(t.tipo)});
  var porFrota={};
  for(var i=0;i<eventos.length;i++){
    var e=eventos[i];
    if(filtroTipo!=='qualquer' && e.tipo!==filtroTipo) continue;
    (porFrota[e.frotaN]=porFrota[e.frotaN]||[]).push(e);
  }
  var res=[];
  for(var v=0;v<viagens.length;v++){
    var t=viagens[v];
    var lista=porFrota[t.carroN]||[];
    var achados=[];
    if(t.real0 && t.fim){
      var ini=t.real0.getTime()-tolMs, fim=t.fim.getTime()+tolMs;
      for(var j=0;j<lista.length;j++){
        var ev=lista[j];
        if(ev.ts>=ini && ev.ts<=fim) achados.push(ev);
      }
      achados.sort(function(a,b){return a.ts-b.ts});
    }
    var prin = achados.length ? (qual==='ultima'?achados[achados.length-1]:achados[0]) : null;
    res.push({
      viagem:t, passagens:achados, ponto:prin,
      divergeMotorista: !!(prin && t.motorista && prin.motorista && !motoristaBate(t.motorista,prin.motorista)),
      t1: prin ? dur(t.real0,prin.dt) : null,
      t2: prin ? dur(prin.dt,t.fim) : null
    });
  }
  return res;
}

/* ---------- classificação de status ---------- */
function classeStatus(s){
  var t=normTexto(s);
  if(!t||t==='NAN') return 'p-none';
  if(t.indexOf('ATRASADO')>=0) return 'p-late';
  if(t.indexOf('ADIANTADO')>=0) return 'p-warn';
  if(t.indexOf('OK')>=0) return 'p-ok';
  return 'p-none';
}
function resumoStatus(s){
  var t=String(s==null?'':s).replace(/\[.*?\]/g,'').trim();
  return t||'—';
}
/* ---------- cruzamento de passageiros (embarque/desembarque por RFID) ----------
   Cada cartão pode passar mais de uma vez na mesma viagem: a 1ª passagem é o embarque,
   a 2ª é o desembarque, a 3ª um novo embarque, e assim por diante (alternância).
   Um passageiro só é contado como "a bordo" num instante T se, até T, ele tiver um
   número ÍMPAR de passagens (embarcou e ainda não desembarcou). Isso evita contar
   a mesma pessoa 2x (embarque + desembarque) como se fossem 2 passageiros. */
function agruparCartoesDaViagem(carroN,tsIni,tsSup,passagens){
  var porCartao={};
  for(var i=0;i<passagens.length;i++){
    var p=passagens[i];
    if(p.carroN!==carroN) continue;
    if(p.ts<tsIni || p.ts>tsSup) continue;
    var chave=p.cartao?('c:'+p.cartao):('s:'+i); // sem código de cartão: trata como passageiro isolado (sempre "a bordo" após a 1ª passagem)
    (porCartao[chave]=porCartao[chave]||[]).push(p.ts);
  }
  return porCartao;
}
function contarABordo(porCartao,tsCorte){
  if(tsCorte==null) return null;
  var n=0;
  for(var chave in porCartao){
    var lista=porCartao[chave];
    var count=0;
    for(var i=0;i<lista.length;i++){ if(lista[i]<=tsCorte) count++; }
    if(count%2===1) n++; // número ímpar de passagens até aqui = embarcado e ainda não desembarcou
  }
  return n;
}
function calcularPassageiros(resultado,passagens){
  passagens=passagens||[];
  for(var i=0;i<resultado.length;i++){
    var r=resultado[i], v=r.viagem;
    var tsIni = v.real0 ? v.real0.getTime() : null;
    var tsPont = r.ponto ? r.ponto.ts : null;
    var tsFim = v.fim ? v.fim.getTime() : (v.real1 ? v.real1.getTime() : null);
    if(!passagens.length || tsIni==null){ r.passPontualidade=null; r.passFinal=null; continue; }
    var candidatos=[tsPont,tsFim].filter(function(t){return t!=null});
    var tsSup = candidatos.length? Math.max.apply(null,candidatos) : null;
    if(tsSup==null){ r.passPontualidade=null; r.passFinal=null; continue; }
    var porCartao=agruparCartoesDaViagem(v.carroN,tsIni,tsSup,passagens);
    r.passPontualidade = contarABordo(porCartao,tsPont);
    r.passFinal = contarABordo(porCartao,tsFim);
  }
  return resultado;
}
if(typeof module!=='undefined'&&module.exports){module.exports={normFrota:normFrota,normTexto:normTexto,nomePonto:nomePonto,nomeMotorista:nomeMotorista,parseData:parseData,prepararEventos:prepararEventos,prepararViagens:prepararViagens,prepararPassagens:prepararPassagens,cruzar:cruzar,calcularPassageiros:calcularPassageiros,agruparCartoesDaViagem:agruparCartoesDaViagem,contarABordo:contarABordo,tipoPlanilha:tipoPlanilha,dur:dur,hhmm:hhmm,motoristaBate:motoristaBate,ehIda:ehIda,linhasComCabecalhoAuto:linhasComCabecalhoAuto};}

<script>
var DADOS={viagens:null,eventos:null,nomeV:'',nomeE:'',passagens1:null,passagens2:null,passagens3:null,nomeP1:'',nomeP2:'',nomeP3:''};
var RESULTADO=[];
var ORDEM={col:'real0',dir:1};
var PADRAO={tolerancia:5,tipoEvento:'entrada',passagem:'primeira'}; // sem filtro na tela por ora
var FILTROS={q:'',operadora:'',card:'todos'};

function $(id){return document.getElementById(id)}
function msg(txt,erro){
  $('msg').innerHTML = txt? '<div class="'+(erro?'err':'note')+'">'+txt+'</div>' : '';
}

/* leitura de arquivo */
function lerArquivo(file,cb){
  var fr=new FileReader();
  fr.onload=function(e){
    try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'}); // serial cru: a conversão de data é feita em parseData, sem depender do fuso do navegador
      var ws=wb.Sheets[wb.SheetNames[0]];
      var matriz=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
      var linhas=linhasComCabecalhoAuto(matriz); // localiza a linha de cabeçalho mesmo quando há título/relatório acima dela
      cb(null,linhas);
    }catch(err){cb(err)}
  };
  fr.onerror=function(){cb(new Error('Não foi possível ler o arquivo.'))};
  fr.readAsArrayBuffer(file);
}

function registrarDrop(idDrop,idInput,alvo){
  var d=$(idDrop), inp=$(idInput);
  ['dragenter','dragover'].forEach(function(ev){d.addEventListener(ev,function(e){e.preventDefault();d.classList.add('over')})});
  ['dragleave','drop'].forEach(function(ev){d.addEventListener(ev,function(e){e.preventDefault();d.classList.remove('over')})});
  d.addEventListener('drop',function(e){ if(e.dataTransfer.files[0]) receber(e.dataTransfer.files[0],alvo,d); });
  inp.addEventListener('change',function(){ if(inp.files[0]) receber(inp.files[0],alvo,d); });
}
function aplicarLinhas(alvo,linhas,nomeArquivo){
  if(alvo==='viagens'){
    DADOS.viagens=prepararViagens(linhas); DADOS.nomeV=nomeArquivo;
    $('chkV').checked=true;
    $('stamp').textContent=dataDoRelatorio(DADOS.viagens)||'—';
  }else if(alvo==='eventos'){
    DADOS.eventos=prepararEventos(linhas); DADOS.nomeE=nomeArquivo;
    $('chkE').checked=true;
  }else if(alvo==='passagens1'){
    DADOS.passagens1=prepararPassagens(linhas,'Mariana'); DADOS.nomeP1=nomeArquivo;
    $('chkP1').checked=true;
  }else if(alvo==='passagens2'){
    DADOS.passagens2=prepararPassagens(linhas,'Santa Bárbara'); DADOS.nomeP2=nomeArquivo;
    $('chkP2').checked=true;
  }else if(alvo==='passagens3'){
    DADOS.passagens3=prepararPassagens(linhas,'Compartilhados'); DADOS.nomeP3=nomeArquivo;
    $('chkP3').checked=true;
  }
}
/* data do relatório = data mais frequente entre as viagens carregadas (não a data de hoje) */
function dataDoRelatorio(viagens){
  var contagem={};
  (viagens||[]).forEach(function(v){
    var d=v.real0||v.prog0||v.real1||v.fim;
    if(!d) return;
    var chave=ddmm(d);
    contagem[chave]=(contagem[chave]||0)+1;
  });
  var melhor=null,max=-1;
  for(var k in contagem){ if(contagem[k]>max){ max=contagem[k]; melhor=k; } }
  return melhor;
}
function receber(file,alvo,elDrop){
  lerArquivo(file,function(err,linhas){
    if(err){ msg('Falha ao ler <b>'+file.name+'</b>: '+err.message,true); return; }
    if(!linhas.length){ msg('A planilha <b>'+file.name+'</b> está vazia ou não foi possível localizar o cabeçalho de colunas.',true); return; }
    var tipo=tipoPlanilha(Object.keys(linhas[0])) || alvo;
    if((alvo==='viagens'||alvo==='eventos') && tipo!==alvo && (tipo==='viagens'||tipo==='eventos')){
      // arquivo trocado de lugar entre viagens/eventos: encaixa no lugar certo
      alvo=tipo;
    }
    aplicarLinhas(alvo,linhas,file.name);
    msg('');
    if(DADOS.viagens&&DADOS.eventos) processar();
  });
}
/* botão "carregar tudo de uma vez": detecta o tipo de cada planilha pelo conteúdo
   e encaixa automaticamente nos slots certos (viagens/eventos/Mariana/Santa Bárbara/Compartilhados) */
function slotPassagensPorNome(nomeArquivo){
  var n=normTexto(nomeArquivo||'');
  if(n.indexOf('MARIANA')>=0) return 'passagens1';
  if(n.indexOf('SANTA BARBARA')>=0 || n.indexOf('SANTA BARB')>=0) return 'passagens2';
  if(n.indexOf('COMPARTILH')>=0 || n.indexOf('COMPART')>=0) return 'passagens3';
  return '';
}
function primeiroSlotPassagensLivre(){
  if(!DADOS.passagens1) return 'passagens1';
  if(!DADOS.passagens2) return 'passagens2';
  if(!DADOS.passagens3) return 'passagens3';
  return '';
}
function receberMultiplos(fileList){
  var arquivos=Array.prototype.slice.call(fileList);
  if(!arquivos.length) return;
  var pendentes=arquivos.length, erros=[];
  arquivos.forEach(function(file){
    lerArquivo(file,function(err,linhas){
      pendentes--;
      if(err){ erros.push(file.name+': '+err.message); }
      else if(!linhas.length){ erros.push(file.name+': planilha vazia ou cabeçalho não encontrado'); }
      else{
        var tipo=tipoPlanilha(Object.keys(linhas[0]));
        if(tipo==='viagens'||tipo==='eventos'){
          aplicarLinhas(tipo,linhas,file.name);
        }else if(tipo==='passagens'){
          var slot=slotPassagensPorNome(file.name) || primeiroSlotPassagensLivre();
          if(slot){
            aplicarLinhas(slot,linhas,file.name);
          }else{
            erros.push(file.name+': já existem três planilhas de cartões carregadas (Mariana, Santa Bárbara e Compartilhados)');
          }
        }else{
          erros.push(file.name+': não foi possível identificar o tipo da planilha (viagens, eventos ou cartões)');
        }
      }
      if(pendentes===0){
        msg(erros.length? erros.join('<br>') : '', erros.length>0);
        if(DADOS.viagens&&DADOS.eventos) processar();
      }
    });
  });
}
function passagensCombinadas(){
  return (DADOS.passagens1||[]).concat(DADOS.passagens2||[],DADOS.passagens3||[]);
}

function processar(){
  RESULTADO=cruzar(DADOS.viagens,DADOS.eventos,PADRAO);
  var passagens=passagensCombinadas();
  calcularPassageiros(RESULTADO,passagens);
  avisarDivergenciaDeData();
  popularOperadoras();
  ligarFiltros();
  $('emptyState').style.display='none';
  $('toolbar').style.display='flex';
  $('bar').style.display='flex';
  $('kpis').style.display='grid';
  $('tablewrap').style.display='block';
  desenhar();
}
/* aviso quando alguma planilha carregada (eventos ou cartões) tem data diferente das viagens —
   sinaliza qual planilha especificamente está com a data errada, pra facilitar a correção */
function intervaloTs(lista,getTs){
  var min=Infinity,max=-Infinity;
  (lista||[]).forEach(function(item){
    var t=getTs(item);
    if(t==null) return;
    if(t<min) min=t; if(t>max) max=t;
  });
  return min===Infinity ? null : {min:min,max:max};
}
function avisarDivergenciaDeData(){
  if(!DADOS.viagens||!DADOS.viagens.length) return;
  var intV=intervaloTs(DADOS.viagens,function(v){return v.real0?v.real0.getTime():(v.prog0?v.prog0.getTime():null)});
  if(!intV) return;
  function faixaTxt(i){ return ddmm(new Date(i.min))+(i.min!==i.max?' a '+ddmm(new Date(i.max)):''); }
  var problemas=[];
  function checar(rotulo,nomeArquivo,lista,getTs){
    if(!lista||!lista.length) return;
    var intX=intervaloTs(lista,getTs);
    if(!intX) return;
    var sobrepoe = intX.min<=intV.max && intX.max>=intV.min;
    if(!sobrepoe){
      problemas.push('<b>'+rotulo+'</b>'+(nomeArquivo?' ("'+nomeArquivo+'")':'')+': '+faixaTxt(intX));
    }
  }
  checar('Eventos',DADOS.nomeE,DADOS.eventos,function(e){return e.ts});
  checar('Cartões · Mariana',DADOS.nomeP1,DADOS.passagens1,function(p){return p.ts});
  checar('Cartões · Santa Bárbara',DADOS.nomeP2,DADOS.passagens2,function(p){return p.ts});
  checar('Cartões · Compartilhados',DADOS.nomeP3,DADOS.passagens3,function(p){return p.ts});
  if(problemas.length){
    msg('A planilha de <b>Viagens</b> está com data '+faixaTxt(intV)+'. As planilhas abaixo parecem ser de outro dia — confira se subiu o arquivo certo:<br>• '+problemas.join('<br>• '),true);
  }
}
function popularOperadoras(){
  var sel=$('filterOperadora');
  var atual=FILTROS.operadora||'';
  var vals=[];
  RESULTADO.forEach(function(r){
    var op=String(r.viagem.operadora==null?'':r.viagem.operadora).trim();
    if(op && vals.indexOf(op)<0) vals.push(op);
  });
  vals.sort(function(a,b){return a.localeCompare(b,'pt-BR')});
  sel.innerHTML='<option value="">Todas</option>'+vals.map(function(op){
    var selected = normTexto(op)===atual ? ' selected' : '';
    return '<option value="'+esc(op)+'"'+selected+'>'+esc(op)+'</option>';
  }).join('');
  if(atual && !vals.some(function(op){return normTexto(op)===atual;})){
    FILTROS.operadora='';
    sel.value='';
  }
}
function ligarFiltros(){
  if(window.__filtrosLigados) return;
  window.__filtrosLigados=true;
  $('search').addEventListener('input',function(){
    FILTROS.q=this.value||'';
    desenhar();
  });
  $('filterOperadora').addEventListener('change',function(){
    FILTROS.operadora=normTexto(this.value||'');
    desenhar();
  });
  $('btnClearFilters').addEventListener('click',function(){
    FILTROS.q=''; FILTROS.operadora=''; FILTROS.card='todos';
    $('search').value='';
    $('filterOperadora').value='';
    desenhar();
  });
}
function filtradosBase(){
  var q=normTexto(FILTROS.q||'');
  var op=FILTROS.operadora||'';
  return RESULTADO.filter(function(r){
    if(op && normTexto(r.viagem.operadora)!==op) return false;
    if(q){
      var alvo=[r.viagem.carro,r.viagem.motorista,r.viagem.linha,r.viagem.itinerario].map(normTexto).join(' | ');
      if(alvo.indexOf(q)<0) return false;
    }
    return true;
  });
}
function filtrados(){
  var linhas=filtradosBase();
  if(FILTROS.card==='com') return linhas.filter(function(r){return !!r.ponto;});
  if(FILTROS.card==='sem') return linhas.filter(function(r){return !r.ponto;});
  return linhas;
}

function iconeCartao(cor){
  return '<svg width="15" height="11" viewBox="0 0 24 18" xmlns="http://www.w3.org/2000/svg">'+
    '<rect x="1" y="1" width="22" height="16" rx="2.5" fill="'+cor+'" stroke="rgba(255,255,255,.55)" stroke-width="1"/>'+
    '<rect x="4" y="5" width="14" height="2" rx="1" fill="#fff" opacity=".9"/>'+
    '<rect x="4" y="9.5" width="9" height="2" rx="1" fill="#fff" opacity=".7"/>'+
  '</svg>';
}
var COLUNAS=[
  {k:'id',       r:'ID Viagem',  g:0, left:false, get:function(r){return r.viagem.id}},
  {k:'carro',    r:'Carro',      g:0, left:true,  get:function(r){return r.viagem.carro}},
  {k:'motorista',r:'Motorista',  g:0, left:true,  get:function(r){return r.viagem.motorista}},
  {k:'operadora',r:'Operadora',  g:0, left:true,  get:function(r){return r.viagem.operadora}},
  {k:'linha',    r:'Linha',      g:0, left:true,  get:function(r){return r.viagem.linha}},
  {k:'itinerario',r:'Viagem',    g:0, left:true,  get:function(r){return r.viagem.itinerario}},
  {k:'ponto0',   r:'Ponto',      g:1, left:true,  get:function(r){return r.viagem.ponto0}},
  {k:'prog0',    r:'H.Prog',     g:1, left:false, get:function(r){return r.viagem.prog0}},
  {k:'real0',    r:'H.Real',     g:1, left:false, get:function(r){return r.viagem.real0}},
  {k:'res0',     r:'Situação',   g:1, left:false, get:function(r){return r.viagem.res0}},
  {k:'ponto1',   r:'Ponto',      g:2, left:true,  get:function(r){return r.viagem.ponto1}},
  {k:'prog1',    r:'H.Prog',     g:2, left:false, get:function(r){return r.viagem.prog1}},
  {k:'phora',    r:'H.Pontualidade', g:2, left:false, get:function(r){return r.ponto?r.ponto.ts:null}},
  {k:'fim',      r:'H.Real',     g:2, left:false, get:function(r){return r.viagem.fim}},
  {k:'res1',     r:'Situação',   g:2, left:false, get:function(r){return r.viagem.res1}},
  {k:'passPont', r:'<span class="colicon" title="Passageiros a bordo até o ponto de pontualidade">'+iconeCartao('#22C55E')+'</span>', g:2, left:false, get:function(r){return r.passPontualidade}},
  {k:'passFim',  r:'<span class="colicon" title="Passageiros a bordo até o ponto final">'+iconeCartao('#EF4444')+'</span>',        g:2, left:false, get:function(r){return r.passFinal}},
  {k:'obs',      r:'Observação', g:3, left:true,  get:function(r){return r.viagem.obs}}
];
var GRUPOS=[{r:'Viagem',n:6},{r:'Partida',n:4},{r:'Chegada',n:7},{r:'Observação',n:1}];

function desenhar(){
  var base=filtradosBase();
  var linhas=filtrados();
  // ordenação
  var col=COLUNAS.filter(function(c){return c.k===ORDEM.col})[0];
  if(col){
    linhas=linhas.slice().sort(function(a,b){
      var x=col.get(a), y=col.get(b);
      if(x instanceof Date) x=x.getTime(); if(y instanceof Date) y=y.getTime();
      if(x==null||x==='') return 1; if(y==null||y==='') return -1;
      if(typeof x==='string') return x.localeCompare(y)*ORDEM.dir;
      return (x-y)*ORDEM.dir;
    });
  }
  // KPIs clicáveis: os números consideram pesquisa e operadora, antes do filtro do card
  var com=base.filter(function(r){return r.ponto}).length;
  var sem=base.length-com;
  var semJan=base.filter(function(r){return !r.ponto&&(!r.viagem.real0||!r.viagem.fim)}).length;
  var pct=base.length?Math.round(com/base.length*1000)/10:0;
  $('kpis').innerHTML=[
    kpi('Viagens (ida)',base.length,(base.length===DADOS.viagens.length?'Exibindo todas as viagens do arquivo':'Filtrando '+base.length+' de '+DADOS.viagens.length+' viagens'),'todos'),
    kpi('Com pontualidade',com,pct+'% das viagens exibidas','com'),
    kpi('Sem registro',sem,semJan?semJan+' sem horário real':'passagem não encontrada','sem')
  ].join('');
  Array.prototype.forEach.call($('kpis').querySelectorAll('.kpi'),function(card){
    card.onclick=function(){FILTROS.card=card.getAttribute('data-filter')||'todos';desenhar();};
  });

  // cabeçalho em dois níveis: bloco (Partida / Chegada) e coluna
  var thg=GRUPOS.map(function(g,i){
    return '<th class="grp g'+i+(i>0?' group-start':'')+'" colspan="'+g.n+'">'+g.r+'</th>';
  }).join('');
  var th=COLUNAS.map(function(c){
    var seta = ORDEM.col===c.k ? (ORDEM.dir>0?' ▲':' ▼') : '';
    var start=(c.k==='ponto0'||c.k==='ponto1'||c.k==='obs')?' group-start':''; return '<th class="sub g'+c.g+start+'" data-k="'+c.k+'">'+c.r+seta+'</th>';
  }).join('');
  $('tbl').tHead.innerHTML='<tr>'+thg+'</tr><tr>'+th+'</tr>';
  // trava a 2ª linha do cabeçalho exatamente abaixo da 1ª, seja qual for a fonte carregada
  (function(){
    var alt=$('tbl').tHead.rows[0].getBoundingClientRect().height;
    Array.prototype.forEach.call($('tbl').tHead.rows[1].cells,function(c){c.style.top=Math.round(alt)+'px'});
  })();
  Array.prototype.forEach.call($('tbl').tHead.querySelectorAll('th.sub'),function(e){
    e.onclick=function(){
      var k=e.getAttribute('data-k');
      if(ORDEM.col===k) ORDEM.dir=-ORDEM.dir; else {ORDEM.col=k;ORDEM.dir=1;}
      desenhar();
    };
  });

  // corpo
  if(!linhas.length){
    $('tbl').tBodies[0].innerHTML='<tr><td colspan="'+COLUNAS.length+'"><div class="empty">Nenhuma viagem para os filtros atuais.</div></td></tr>';
  }else{
    var html=[];
    linhas.forEach(function(r,i){
      var v=r.viagem, p=r.ponto;
      html.push('<tr class="'+(p?'':'no-hit')+'">'+
        td('<span class="mono">'+esc(v.id!=null?v.id:'—')+'</span>')+
        tdL(esc(v.carro)+'<span class="pt">'+esc(p?p.chapa:'')+'</span>')+
        tdW(esc(v.motorista)+(r.divergeMotorista?' <span class="pill p-warn" title="Evento registrado com '+esc(p.motorista)+'">≠</span>':''))+
        tdL(esc(v.operadora))+
        tdL(esc(v.linha))+
        tdW(esc(v.itinerario))+
        tdW(esc(v.ponto0))+
        tdT(v.prog0? hhmm(v.prog0):null)+
        tdT(v.real0? hhmm(v.real0):null, v.real0?ddmm(v.real0):'')+
        td(pill(v.res0))+
        tdW(esc(v.ponto1))+
        tdT(v.prog1? hhmm(v.prog1):null)+
        '<td class="t marca brk">'+(p? hhmm(p.dt)+'<span class="ptline"><span class="pt" title="'+esc(p.zona)+'">'+esc(p.ponto)+'</span></span>' : '<span class="dash">—</span>')+'</td>'+
        tdT(v.fim?hhmm(v.fim):null)+
        td(pill(v.res1))+
        td(r.passPontualidade==null?'<span class="dash">—</span>':r.passPontualidade)+
        td(r.passFinal==null?'<span class="dash">—</span>':r.passFinal)+
        tdW(v.obs?esc(v.obs):'<span class="dash">—</span>')+
      '</tr>');
    });
    $('tbl').tBodies[0].innerHTML=html.join('');
  }
}
function kpi(l,v,s,f){return '<div class="kpi '+(FILTROS.card===f?'active':'')+'" data-filter="'+f+'" role="button" tabindex="0"><div class="kpi-l">'+l+'</div><div class="kpi-v">'+v+'</div><div class="kpi-s">'+s+'</div></div>'}
function td(h){return '<td>'+h+'</td>'}
function tdL(h){return '<td class="left">'+h+'</td>'}
function tdW(h){return '<td class="left brk">'+h+'</td>'}
function tdT(h,sub){return '<td class="t">'+(h?h:'<span class="dash">—</span>')+(sub?'<span class="pt">'+sub+'</span>':'')+'</td>'}
function pill(s){var t=resumoStatus(s); if(t==='—')return '<span class="dash">—</span>'; return '<span class="pill '+classeStatus(s)+'">'+esc(t)+'</span>'}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

/* exportação */
function statusCores(txt){
  var t=resumoStatus(txt);
  if(t.indexOf('Atrasado')>=0) return {bg:'FFFBE4E0',font:'FFC4291A'};
  if(t.indexOf('Adiantado')>=0) return {bg:'FFFBF0DC',font:'FFB77500'};
  if(t.indexOf('Ok')>=0) return {bg:'FFE4F2ED',font:'FF17795E'};
  return null;
}
async function exportarExcel(){
  var wb=new ExcelJS.Workbook();
  wb.creator='Univale Transportes';
  wb.created=new Date();
  var ws=wb.addWorksheet('Pontualidade',{views:[{state:'frozen',ySplit:3}]});

  var grupos=[
    {label:'VIAGEM',      cols:9, cor:'FF115E59', sub:'FF174F4B'},
    {label:'PARTIDA',     cols:4, cor:'FF176D67', sub:'FF1D5D58'},
    {label:'CHEGADA',     cols:5, cor:'FF1D7B74', sub:'FF246B65'},
    {label:'PONTUALIDADE',cols:1, cor:'FF23857D', sub:'FF2A756F'},
    {label:'PASSAGEIROS', cols:2, cor:'FF0E6B62', sub:'FF135F57'},
    {label:'OBSERVAÇÃO',  cols:1, cor:'FF286F6A', sub:'FF315F5B'}
  ];
  var totalCols=grupos.reduce(function(s,g){return s+g.cols},0);

  // título com a data do relatório (identificada a partir da planilha de viagens, não a data de hoje)
  var dataRel=dataDoRelatorio(DADOS.viagens)||'não identificada';
  ws.mergeCells(1,1,1,totalCols);
  var tit=ws.getCell(1,1);
  tit.value='RELATÓRIO DE PONTUALIDADE DE VIAGENS  —  DATA: '+dataRel;
  tit.font={color:{argb:'FFFFFFFF'},bold:true,size:13};
  tit.alignment={horizontal:'center',vertical:'middle'};
  tit.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0B4A45'}};
  ws.getRow(1).height=26;

  var headers=['ID Viagem','Carro','Placa','Motorista','Operadora','Linha','Viagem','Tipo','Data',
    'Ponto','H.Prog','H.Real','Situação',
    'Ponto','H.Prog','H.Pontualidade','H.Real','Situação',
    'Ponto de pontualidade','Passageiros Pontualidade','Passageiros P.Final','Observação'];
  var esquerda={9:1,10:1,4:1,7:1,14:1,19:1,22:1}; // colunas (1-based) com texto mais longo: alinhadas à esquerda

  var col=1;
  grupos.forEach(function(g){
    var ini=col, fim=col+g.cols-1;
    ws.mergeCells(2,ini,2,fim);
    var cell=ws.getCell(2,ini);
    cell.value=g.label;
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:g.cor}};
    cell.font={color:{argb:'FFFFFFFF'},bold:true,size:11};
    cell.alignment={horizontal:'center',vertical:'middle'};
    col=fim+1;
  });
  ws.getRow(2).height=20;

  var faixas=[
    {ini:1,fim:9,cor:grupos[0].sub},
    {ini:10,fim:13,cor:grupos[1].sub},
    {ini:14,fim:18,cor:grupos[2].sub},
    {ini:19,fim:19,cor:grupos[3].sub},
    {ini:20,fim:21,cor:grupos[4].sub},
    {ini:22,fim:22,cor:grupos[5].sub}
  ];
  headers.forEach(function(h,i){
    var ci=i+1, faixa=faixas.filter(function(f){return ci>=f.ini&&ci<=f.fim})[0];
    var cell=ws.getCell(3,ci);
    cell.value=h;
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:faixa.cor}};
    cell.font={color:{argb:'FFFFFFFF'},bold:true,size:10};
    cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    cell.border={bottom:{style:'thin',color:{argb:'FF8CB7B2'}}};
    if([10,14,19,20,22].indexOf(ci)>=0) cell.border.left={style:'medium',color:{argb:'FFB9D9D5'}};
  });
  ws.getRow(3).height=28;

  var linhas=$('exportFiltered').checked?filtrados():RESULTADO.slice();
  linhas.forEach(function(r,idx){
    var v=r.viagem,p=r.ponto;
    var rowIdx=idx+4;
    var vals=[v.id!=null?v.id:'',v.carro,p?p.chapa:'',v.motorista,v.operadora,v.linha,v.itinerario,v.tipo,
      v.real0?ddmm(v.real0):(v.prog0?ddmm(v.prog0):''),
      v.ponto0,v.prog0?hhmm(v.prog0):'',v.real0?hhmm(v.real0):'',resumoStatus(v.res0),
      v.ponto1,v.prog1?hhmm(v.prog1):'',p?hhmm(p.dt):'',v.fim?hhmm(v.fim):'',resumoStatus(v.res1),
      p?p.ponto:'',r.passPontualidade==null?'':r.passPontualidade,r.passFinal==null?'':r.passFinal,v.obs||''];
    vals.forEach(function(val,ci){
      var cell=ws.getCell(rowIdx,ci+1);
      cell.value=val;
      cell.alignment={vertical:'middle',horizontal:esquerda[ci+1]?'left':'center',wrapText:ci===21};
      cell.border={bottom:{style:'thin',color:{argb:'FFD8E4E2'}}};
      if([10,14,19,20,22].indexOf(ci+1)>=0) cell.border.left={style:'thin',color:{argb:'FFA9C9C5'}};
      if(idx%2===1) cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF3F9F8'}};
    });
    [12,17].forEach(function(ci){ // Situação partida / Situação chegada
      var c=statusCores(vals[ci]);
      if(c){
        var cell=ws.getCell(rowIdx,ci+1);
        cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:c.bg}};
        cell.font={color:{argb:c.font},bold:true};
      }
    });
  });

  var larguras=[10,9,11,20,16,9,26,7,11, 15,9,9,11, 15,9,12,9,11, 26, 14,10, 45];
  larguras.forEach(function(w,i){ ws.getColumn(i+1).width=w; });

  var buf=await wb.xlsx.writeBuffer();
  baixar(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),$('exportFiltered').checked?'relatorio_pontualidade_filtrado.xlsx':'relatorio_pontualidade_completo.xlsx');
}
$('btnXlsx').onclick=function(){ exportarExcel(); };
function baixar(blob,nome){
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=nome; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href)},2000);
}

/* eventos de UI */
$('fileTodos').addEventListener('change',function(){ if(this.files.length) receberMultiplos(this.files); this.value=''; });
$('btnTodos').addEventListener('click',function(){ $('fileTodos').click(); });
$('btnLimpar').addEventListener('click',function(){
  if(!DADOS.viagens&&!DADOS.eventos&&!DADOS.passagens1&&!DADOS.passagens2&&!DADOS.passagens3) return;
  if(!confirm('Isso vai apagar todas as planilhas carregadas (viagens, eventos e cartões) pra você subir os dados de outro dia. Continuar?')) return;
  limparTudo();
});
function limparTudo(){
  DADOS={viagens:null,eventos:null,nomeV:'',nomeE:'',passagens1:null,passagens2:null,passagens3:null,nomeP1:'',nomeP2:'',nomeP3:''};
  RESULTADO=[];
  FILTROS.q=''; FILTROS.operadora=''; FILTROS.card='todos';
  ['chkV','chkE','chkP1','chkP2','chkP3'].forEach(function(id){ $(id).checked=false; });
  $('stamp').textContent='—';
  $('search').value='';
  $('filterOperadora').innerHTML='<option value="">Todas</option>';
  $('toolbar').style.display='none';
  $('bar').style.display='none';
  $('kpis').style.display='none';
  $('kpis').innerHTML='';
  $('tablewrap').style.display='none';
  var tb=document.querySelector('#tbl tbody'); if(tb) tb.innerHTML='';
  $('emptyState').style.display='block';
  msg('');
}
$('stamp').textContent='—';
</script>
