<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de Rotas — Univale</title>
<meta name="theme-color" content="#009f9a">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
 --green:#009f9a;--green2:#00b9ad;--greenDark:#075c5b;--greenDeep:#064443;
 --mint:#eaf7f6;--mint2:#f4fbfa;--white:#fff;--text:#123c43;--muted:#6d878b;--border:#d8e9e7;
 --shadow:0 12px 34px rgba(10,80,78,.09);
}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#f8fcfc 0%,#e8f5f4 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,159,154,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,159,154,.035) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 92%)}
.app{max-width:1680px;min-height:100vh;margin:0 auto;padding:14px 18px 12px;display:grid;grid-template-rows:68px 1fr 24px;gap:12px;position:relative}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 4px;border-bottom:1px solid rgba(0,159,154,.13);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:18px}.brand img{width:148px;height:54px;object-fit:contain;display:block}.brand-copy{display:grid;gap:2px}.brand-copy strong{font-size:17px;letter-spacing:-.25px;color:#17484b}.brand-copy span{font-size:11px;color:#739194}
.nav{display:flex;gap:12px;align-items:center;font-size:12px;font-weight:600;color:#1f5257}.nav i{font-style:normal;color:#7fb5b0}.nav span{white-space:nowrap}
.workspace{position:relative;display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;min-height:610px;z-index:1}
.fleet-showcase{position:relative;flex:1;min-height:250px;margin-top:4px;overflow:hidden;border-radius:14px;background:radial-gradient(circle at 50% 86%,rgba(0,159,154,.10),transparent 42%),linear-gradient(180deg,rgba(255,255,255,0),rgba(234,247,246,.55));pointer-events:none}
.fleet-showcase:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(0,159,154,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,159,154,.025) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 35%,rgba(0,0,0,.8) 100%)}
.fleet-showcase:after{content:"";position:absolute;left:13%;right:13%;bottom:18px;height:30px;background:radial-gradient(ellipse,rgba(0,94,91,.16),rgba(0,94,91,0) 72%);filter:blur(8px)}
.fleet-slide{position:absolute;inset:0;display:grid;place-items:end center;padding:12px 4px 24px;opacity:0;transform:translateY(5px) scale(.985);transition:opacity 1s ease,transform 1s ease}.fleet-slide.active{opacity:1;transform:translateY(0) scale(1)}
.fleet-slide img{max-width:94%;max-height:225px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 14px 18px rgba(4,84,80,.16))}
.panel{position:relative;z-index:2;background:rgba(255,255,255,.93);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.sidebar{padding:15px 14px;display:flex;flex-direction:column;gap:12px;min-height:610px;background:rgba(255,255,255,.91)}
.section-kicker{font-size:10px;font-weight:800;letter-spacing:1.45px;text-transform:uppercase;color:#4d7d79}.section-title{font-size:15px;font-weight:800;color:#17484b;margin-top:2px}.section-sub{font-size:11px;color:#537073;margin-top:2px;line-height:1.3;font-weight:500}
.selector{display:grid;gap:6px}.selector label{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#446a6f}.select-wrap{position:relative}.select-wrap:after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-55%);font-size:13px;color:#53807f;pointer-events:none}select{appearance:none;width:100%;height:38px;border:1px solid #cee2df;border-radius:9px;background:#fff;color:#214a50;padding:0 30px 0 10px;font-size:12px;outline:none}select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,159,154,.09)}
.route-summary{padding:12px 11px;border-radius:12px;background:linear-gradient(180deg,#f6fbfb,#eef8f7);border:1px solid #dcecea}.route-code{font-size:27px;font-weight:850;letter-spacing:-.9px;line-height:1}.route-name{font-size:12px;font-weight:700;color:#2e585d;margin-top:5px;min-height:28px;line-height:1.2}.route-pills{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.pill{padding:5px 8px;border-radius:999px;font-size:9px;font-weight:850;letter-spacing:.5px;text-transform:uppercase;background:#dff5f2;color:#0c7875}.pill.time{background:#edf3f2;color:#577679}
.metrics{display:grid;gap:6px}.metric{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:8px 9px;border-bottom:1px solid #e8f1f0}.metric:last-child{border-bottom:0}.metric-icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:#e7f7f5;color:#008d88;font-size:14px}.metric-copy small{display:block;font-size:9.5px;letter-spacing:.65px;text-transform:uppercase;color:#1f4f54;margin-bottom:1px;font-weight:800}.metric-copy span{font-size:10.5px;color:#2b5357;font-weight:600}.metric strong{font-size:17px;letter-spacing:-.35px;color:#0b3134;white-space:nowrap}
.divider{height:1px;background:#e8f1f0}.sidebar-actions{margin-top:auto;display:grid;gap:7px}.btn{height:36px;border-radius:9px;border:1px solid transparent;font-size:11px;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(180deg,#0eb0a8,#009a95);color:#fff;box-shadow:0 7px 16px rgba(0,159,154,.18)}.btn-light{background:#fff;border-color:#d5e7e5;color:#2d6263}
.map-panel{display:grid;grid-template-rows:54px 1fr;min-width:0;overflow:hidden}.map-head{display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 14px;border-bottom:1px solid #e2eeec;background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(248,252,252,.95))}.map-title{display:grid;gap:1px;min-width:0}.map-title strong{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.map-title span{font-size:10px;color:#4e6c70;font-weight:600}.map-kpis{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.kpi{padding:5px 8px;border:1px solid #dbeae8;border-radius:999px;background:#fff;font-size:10px;color:#456c6d;font-weight:700}.kpi b{color:#164d50;font-size:11px}
.map-wrap{position:relative;min-height:0;background:#e9f4f2}#map{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#eaf4f2,#dbeae7)}#map.fallback:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(0,159,154,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,159,154,.08) 1px,transparent 1px);background-size:42px 42px}
.map-overlay{position:absolute;left:12px;bottom:12px;z-index:600;display:flex;gap:9px;padding:8px 10px;border:1px solid rgba(255,255,255,.9);border-radius:10px;background:rgba(255,255,255,.93);box-shadow:0 6px 16px rgba(11,75,73,.09);font-size:10px;color:#365f62;font-weight:650}.map-overlay span{display:flex;align-items:center;gap:5px}.map-overlay i{width:8px;height:8px;border-radius:50%;display:inline-block;border:1.5px solid #fff;box-shadow:0 0 0 1px #16a59f}.map-overlay .start{background:#14b7a4}.map-overlay .mid{width:17px;height:3px;border:0;border-radius:999px;background:#00a49e;box-shadow:none}.map-overlay .end{background:#f16672;box-shadow:0 0 0 1px #f16672}.map-style-switch{position:absolute;top:12px;right:12px;z-index:650;display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.96);box-shadow:0 7px 18px rgba(11,75,73,.14);backdrop-filter:blur(8px)}.map-style-switch button{height:28px;border:0;border-radius:7px;background:transparent;color:#4c6c70;padding:0 10px;font-size:10px;font-weight:800;cursor:pointer;transition:.18s ease}.map-style-switch button:hover{background:#eef8f7;color:#176c69}.map-style-switch button.active{background:linear-gradient(180deg,#11aca5,#009b96);color:#fff;box-shadow:0 4px 10px rgba(0,159,154,.18)}
.map-error{position:absolute;top:12px;right:12px;z-index:650;max-width:290px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.94);border:1px solid #dceae8;box-shadow:0 8px 18px rgba(11,75,73,.09);font-size:10px;color:#5f7f82}.leaflet-control-zoom{border:none!important;box-shadow:0 8px 18px rgba(11,75,73,.12)}.leaflet-control-zoom a{width:34px;height:34px;line-height:34px;background:#fff!important;color:#0d6f6c!important;border:none!important}.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.85)!important}.leaflet-tooltip.route-chip{background:#fff;color:#174c4e;border:1px solid #d8e8e6;border-radius:8px;box-shadow:0 5px 14px rgba(8,82,78,.11);font-size:10px;font-weight:800;padding:5px 7px}.leaflet-tooltip.route-chip:before{border-top-color:#fff}
footer{display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 3px;color:#527173;font-size:10px;font-weight:600}.footer-brand{font-weight:850;letter-spacing:1.1px;color:#245d5d}.footer-brand i{font-style:normal;color:var(--green);padding:0 5px}
@media(max-width:980px){.workspace{grid-template-columns:310px 1fr}.brand-copy{display:none}.nav{display:none}.fleet-showcase{min-height:220px}.fleet-slide img{max-height:195px}}
@media(max-width:760px){body{overflow:auto}.app{grid-template-rows:auto auto auto}.topbar{height:64px}.workspace{grid-template-columns:1fr}.sidebar{min-height:auto}.map-panel{min-height:60vh}.fleet-showcase{min-height:210px}.fleet-slide img{max-height:185px}}
.empty-state{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:640;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.95);border:1px solid #dceae8;font-size:13px;font-weight:700;color:#2b5357}
.btn{padding:0 12px}
.app.editor{grid-template-rows:68px minmax(0,1fr) 24px;height:100vh;min-height:0}
.user-chip{display:flex;align-items:center;gap:10px;font-size:11px;color:#2b5357;font-weight:600}
.user-chip .who{padding:5px 10px;border-radius:999px;background:#e7f7f5;color:#0c6764}
.link-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;background:linear-gradient(180deg,#0eb0a8,#009a95);color:#fff;text-decoration:none;font-size:11px;font-weight:800;box-shadow:0 7px 16px rgba(0,159,154,.18)}
.ed-workspace{display:grid;grid-template-columns:400px minmax(0,1fr);gap:12px;min-height:0;position:relative;z-index:1}
.ed-side{padding:15px 14px;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:hidden}
.drop{display:grid;place-items:center;gap:6px;text-align:center;padding:20px 14px;border:1.5px dashed #9fd3ce;border-radius:12px;background:#f4fbfa;cursor:pointer;transition:.15s}
.drop:hover,.drop.over{background:#e3f6f3;border-color:var(--green)}
.drop b{font-size:13px;color:#17484b}.drop span{font-size:11px;color:#46686c}
.drop .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#dff5f2;color:#008d88;font-size:18px;font-weight:800}
.drop input{display:none}
.queue-head{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#446a6f}
.queue{display:grid;gap:8px;overflow:auto;min-height:0;flex:1;padding-right:2px;align-content:start}
.queue-empty{font-size:11px;color:#5d7b7e;padding:10px;border-radius:10px;background:#f6fbfb;border:1px solid #e3efed}
.qitem{border:1px solid #dcecea;border-radius:12px;padding:10px;background:#fff;display:grid;gap:8px}
.qitem.err{border-color:#f3c2c7;background:#fff7f8}
.qitem .file{font-size:10px;color:#5b7a7d;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .stats{font-size:11px;color:#2b5357;font-weight:700}
.qitem .msg{font-size:11px;color:#b23a48;font-weight:600}
.qitem .dup{display:flex;align-items:center;gap:6px;font-size:11px;color:#8a5a00;background:#fff6e0;border:1px solid #f1dfb0;border-radius:8px;padding:6px 8px;font-weight:600}
.qitem .row-actions{display:flex;gap:6px;justify-content:flex-end}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fields .full{grid-column:1/-1}
.field{display:grid;gap:3px}.field label{font-size:9px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#446a6f}
.field input,.field select{height:32px;border:1px solid #cee2df;border-radius:8px;background:#fff;color:#173f44;padding:0 9px;font-size:12px;outline:none;width:100%}
.field select{appearance:auto}
.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,159,154,.09)}
.btn{padding:0 12px}.btn-sm{height:28px;font-size:10.5px;padding:0 9px;border-radius:8px}
.btn-danger{background:#fff;border-color:#f0c9cd;color:#b23a48}
.btn:disabled{opacity:.55;cursor:not-allowed}
.side-actions{display:grid;grid-template-columns:1fr auto;gap:7px}
.ed-main{display:grid;grid-template-rows:minmax(300px,48%) minmax(0,1fr);gap:12px;min-height:0}
.list-panel{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid #e2eeec}
.list-head strong{font-size:14px}.list-head input{height:32px;width:260px;max-width:50%;border:1px solid #cee2df;border-radius:8px;padding:0 10px;font-size:12px;outline:none}
.table-wrap{overflow:auto;min-height:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:#f4fbfa;text-align:left;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;color:#365f62;padding:8px 10px;border-bottom:1px solid #e2eeec;z-index:1}
td{padding:8px 10px;border-bottom:1px solid #edf4f3;color:#173f44;white-space:nowrap}
td.nome{white-space:normal;min-width:140px}
tr.sel td{background:#eaf8f6}
tbody tr:hover td{background:#f5fbfa}
td.num{text-align:right;font-variant-numeric:tabular-nums}
td.acoes{text-align:right}td.acoes .btn{margin-left:4px}
.tag{display:inline-block;padding:3px 7px;border-radius:999px;font-size:9.5px;font-weight:800;background:#dff5f2;color:#0c7875}
.muted{color:#5d7b7e;font-size:11px}
.modal-bg{position:fixed;inset:0;background:rgba(9,45,46,.35);display:grid;place-items:center;z-index:2000;padding:16px}
.modal{width:min(480px,100%);background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(5,50,50,.25);padding:18px;display:grid;gap:12px}
.modal h3{margin:0;font-size:16px;color:#17484b}.modal p{margin:0;font-size:12px;color:#365f62;line-height:1.45}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:3000;padding:10px 16px;border-radius:10px;background:#0f4f50;color:#fff;font-size:12px;font-weight:600;box-shadow:0 10px 26px rgba(5,50,50,.25);max-width:90vw}
.toast.err{background:#a23142}
.busy{position:fixed;inset:0;z-index:2500;background:rgba(255,255,255,.55);display:grid;place-items:center;font-size:13px;font-weight:700;color:#0f4f50}
@media(max-width:980px){.app.editor{height:auto;min-height:100vh}.ed-side{max-height:none}.queue{max-height:60vh}.ed-workspace{grid-template-columns:1fr}.ed-main{grid-template-rows:360px auto}.user-chip .who{display:none}}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:16px;position:relative;z-index:1}
.login{width:min(360px,100%);padding:22px;display:grid;gap:12px}
.login img{width:140px;height:50px;object-fit:contain}
.login .btn{height:38px}
.login-erro{font-size:12px;color:#b23a48;font-weight:600}
.login-link{font-size:11px;color:#0c6764;font-weight:700;text-align:center;text-decoration:none}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px;padding:3px;border-radius:10px;background:rgba(255,255,255,.8);border:1px solid #dcecea}
.tabs button{height:30px;border:0;border-radius:8px;background:transparent;color:#2b5357;padding:0 14px;font-size:11.5px;font-weight:800;cursor:pointer}
.tabs button:hover{background:#eef8f7}.tabs button.active{background:linear-gradient(180deg,#11aca5,#009b96);color:#fff}
.admin-panel{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden;position:relative;z-index:1}
.head-actions{display:flex;gap:8px;align-items:center}

.tag.on{background:#dff5f2;color:#0c7875}.tag.off{background:#f1f1f1;color:#6b6b6b}.tag.adm{background:#e3ecff;color:#2a4f9c}
.tag.criar{background:#dff5f2;color:#0c7875}.tag.alterar{background:#fff1d6;color:#8a5a00}.tag.excluir{background:#fde3e6;color:#a23142}.tag.acesso{background:#eef1f3;color:#4b5d63}
td.det{white-space:normal;min-width:260px;color:#365f62;font-size:11.5px}

.menu-head{display:flex;align-items:center;gap:16px}.menu-head img{width:140px;height:50px;object-fit:contain}

<body>
<div id="app-root"><div class="login-wrap"><div class="section-sub">Carregando...</div></div></div>

<template id="tpl-apresentacao">
<div class="app">
<header class="topbar"><div class="brand"><img class="logo-univale" alt="Univale"><div class="brand-copy"><strong>Visualizador de Rotas</strong></div></div><div class="nav"><span>Fretamento</span><i>|</i><span>Urbano</span><i>|</i><span>Turismo</span></div></header>
<div class="workspace">
<aside class="panel sidebar">
<div><div class="section-kicker">Apresentador KML</div><div class="section-title">Linha / Rota</div></div>
<div class="selector"><label for="route">Escolha a rota</label><div class="select-wrap"><select id="route"></select></div></div>
<div class="route-summary"><div class="route-code" id="route-code">--</div><div class="route-name" id="route-name">Carregando...</div><div class="route-pills"><span class="pill" id="route-direction">Rota</span><span class="pill time" id="route-time">--:--</span></div></div>
<div class="divider"></div>
<div class="metrics">
<div class="metric"><span class="metric-icon">↗</span><div class="metric-copy"><small>Distância</small><span>Percurso aproximado</span></div><strong id="distance">0 km</strong></div>

</div>
<div class="fleet-showcase" id="fleet-backdrop" aria-label="Frota Univale em alternância automática"></div>
</aside>
<section class="panel map-panel"><div class="map-head"><div class="map-title"><strong id="map-title">Rota selecionada</strong><span id="map-subtitle">Visualização do percurso</span></div></div><div class="map-wrap"><div id="map"></div><div class="map-style-switch" aria-label="Estilo do mapa"><button id="map-satellite" class="active" type="button">Satélite</button><button id="map-streets" type="button">Ruas</button></div><div class="map-error" id="map-error" hidden>Mapa base indisponível. O percurso continua visível no modo de apresentação.</div><div class="empty-state" id="empty-state" hidden>Nenhuma rota cadastrada ainda.</div><div class="map-overlay"><span><i class="start"></i>Início</span><span><i class="mid"></i>Percurso</span><span><i class="end"></i>Fim</span></div></div></section>
</div>
<footer><span class="footer-brand">UNIVALE <i>/</i> ROTAS</span></footer>
</div>
</template>

<template id="tpl-editor">
<div class="app editor">
<header class="topbar">
  <div class="brand"><img class="logo-univale" alt="Univale"><div class="brand-copy"><strong>Editor de Rotas</strong></div></div>
  <nav class="tabs" id="tabs"><button type="button" data-tab="rotas" class="active">Rotas</button><button type="button" data-tab="usuarios" class="so-admin">Usuários</button><button type="button" data-tab="log" class="so-admin">Histórico</button></nav>
  <div class="user-chip"><span class="who" id="who"></span><button class="btn btn-light btn-sm" id="minha-senha" type="button">Minha senha</button><button class="btn btn-light btn-sm" id="sair" type="button">Sair</button><a class="link-btn" id="ver-apresentacao" target="_blank" rel="noopener">Abrir apresentação ↗</a></div>
</header>

<div class="ed-workspace" id="ed-rotas">
  <aside class="panel ed-side">
    <div><div class="section-kicker">Importar KML</div><div class="section-title">Novas rotas</div></div>
    <label class="drop" id="drop">
      <span class="ico">+</span><b>Selecionar arquivos KML</b><span>ou arraste e solte aqui</span>
      <input type="file" id="arquivos" accept=".kml" multiple>
    </label>
    <div class="queue-head"><span id="fila-titulo">Fila de importação</span><button class="btn btn-light btn-sm" id="limpar-fila" type="button">Limpar</button></div>
    <div class="queue" id="fila"></div>
    <div class="side-actions"><button class="btn btn-primary" id="salvar-fila" type="button" disabled>Salvar rotas</button></div>
  </aside>

  <div class="ed-main">
    <section class="panel map-panel">
      <div class="map-head"><div class="map-title"><strong id="map-title">Pré-visualização</strong><span id="map-subtitle">Clique em "Ver" em uma rota para mostrar no mapa</span></div></div>
      <div class="map-wrap"><div id="map"></div><div class="map-style-switch"><button id="map-satellite" class="active" type="button">Satélite</button><button id="map-streets" type="button">Ruas</button></div><div class="map-error" id="map-error" hidden>Mapa base indisponível.</div></div>
    </section>
    <section class="panel list-panel">
      <div class="list-head"><strong id="lista-titulo">Rotas salvas</strong><input type="search" id="busca" placeholder="Buscar por código, nome, sentido..."></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Código</th><th>Nome</th><th>Sentido</th><th>Dias / horário</th><th style="text-align:right">Distância</th><th>Atualizado</th><th></th></tr></thead>
        <tbody id="tabela"></tbody>
      </table></div>
    </section>
  </div>
</div>

<section class="panel admin-panel" id="painel-usuarios" hidden>
  <div class="list-head"><strong id="usu-titulo">Usuários</strong><div class="head-actions"><input type="search" id="usu-busca" placeholder="Buscar por nome ou e-mail..."><button class="btn btn-primary btn-sm" id="usu-novo" type="button">+ Novo usuário</button></div></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead>
    <tbody id="usu-tabela"></tbody>
  </table></div>
</section>
<section class="panel admin-panel" id="painel-log" hidden>
  <div class="list-head"><strong id="log-titulo">Histórico</strong><div class="head-actions">
    <select id="log-filtro"><option value="">Todas as ações</option><option value="ROTA">Rotas</option><option value="USUARIO|SENHA">Usuários e senhas</option><option value="LOGIN|LOGOUT">Acessos</option></select>
    <input type="search" id="log-busca" placeholder="Buscar por usuário, rota..."><button class="btn btn-light btn-sm" id="log-atualizar" type="button">Atualizar</button></div></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Data / hora</th><th>Usuário</th><th>Ação</th><th>Item</th><th>Detalhes</th></tr></thead>
    <tbody id="log-tabela"></tbody>
  </table></div>
</section>
<footer><span class="footer-brand">UNIVALE <i>/</i> ROTAS</span><span>As alterações salvas aparecem na apresentação ao recarregar a página.</span></footer>
</div>

<div id="modal-root"></div>

<template id="tpl-login">
<div class="login-wrap"><form class="panel login" id="login-form" autocomplete="on">
  <img class="logo-univale" alt="Univale">
  <div><div class="section-kicker">Editor de rotas</div><div class="section-title">Acesso da operação</div></div>
  <div class="field"><label for="l-login">E-mail</label><input id="l-login" name="login" type="email" autocomplete="username" maxlength="120"></div>
  <div class="field"><label for="l-senha">Senha</label><input id="l-senha" name="senha" type="password" autocomplete="current-password"></div>
  <div class="login-erro" id="login-erro" hidden></div>
  <button class="btn btn-primary" type="submit">Entrar</button>
  <a class="login-link" id="link-apresentacao" href="?view=apresentacao">Ver apresentação das rotas</a>
</form></div>
</template>



<template id="tpl-trocar">
<div class="login-wrap"><form class="panel login" id="troca-form" autocomplete="off">
  <img class="logo-univale" alt="Univale">
  <div><div class="section-kicker">Editor de rotas</div><div class="section-title">Defina sua senha</div></div>
  <div class="field"><label for="t-atual">Senha atual (provisória)</label><input id="t-atual" type="password" autocomplete="current-password"></div>
  <div class="field"><label for="t-nova">Nova senha</label><input id="t-nova" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></div>
  <div class="field"><label for="t-conf">Confirme a nova senha</label><input id="t-conf" type="password" autocomplete="new-password"></div>
  <div class="login-erro" id="troca-erro" hidden></div>
  <button class="btn btn-primary" type="submit">Salvar nova senha</button>
  <a class="login-link" href="#" id="troca-sair">Sair</a>
</form></div>
</template>

<script>
/* Funções compartilhadas: trajeto (polyline), distância, leitura de KML e rótulos */
const Rotas = (function () {
  const SENTIDOS = ['SAÍDA', 'CHEGADA', 'RETORNO', 'ROTA'];

  // Polyline codificada (precisão 5) — guarda o trajeto de forma compacta na planilha
  function codificar(coords) {
    let out = '', pLat = 0, pLng = 0;
    const enc = v => { v = v < 0 ? ~(v << 1) : v << 1; let s = ''; while (v >= 0x20) { s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; } return s + String.fromCharCode(v + 63); };
    coords.forEach(([la, lo]) => { const a = Math.round(la * 1e5), b = Math.round(lo * 1e5); out += enc(a - pLat) + enc(b - pLng); pLat = a; pLng = b; });
    return out;
  }
  function decodificar(str) {
    const pts = []; let i = 0, la = 0, lo = 0;
    const dec = () => { let r = 0, s = 0, b; do { b = str.charCodeAt(i++) - 63; r |= (b & 0x1f) << s; s += 5; } while (b >= 0x20); return r & 1 ? ~(r >> 1) : r >> 1; };
    while (i < str.length) { la += dec(); lo += dec(); pts.push([la / 1e5, lo / 1e5]); }
    return pts;
  }

  function hav(a, b) {
    const R = 6371, r = Math.PI / 180, dLa = (b[0] - a[0]) * r, dLo = (b[1] - a[1]) * r;
    const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function comprimento(c) { let d = 0; for (let i = 1; i < c.length; i++) d += hav(c[i - 1], c[i]); return d; }

  // Douglas-Peucker: só usado se um trajeto for grande demais para uma célula
  function simplificar(c, tol) {
    if (c.length < 3) return c;
    const keep = new Uint8Array(c.length); keep[0] = keep[c.length - 1] = 1;
    const pilha = [[0, c.length - 1]];
    while (pilha.length) {
      const [s, e] = pilha.pop(); let max = 0, idx = -1;
      const [y1, x1] = c[s], [y2, x2] = c[e], dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy;
      for (let i = s + 1; i < e; i++) {
        const [y, x] = c[i]; let t = L ? ((x - x1) * dx + (y - y1) * dy) / L : 0; t = Math.max(0, Math.min(1, t));
        const d = Math.hypot(x - (x1 + t * dx), y - (y1 + t * dy)); if (d > max) { max = d; idx = i; }
      }
      if (max > tol) { keep[idx] = 1; pilha.push([s, idx], [idx, e]); }
    }
    return c.filter((_, i) => keep[i]);
  }

  function normSentido(s) {
    s = String(s || '').toUpperCase().replace('SAIDA', 'SAÍDA');
    return SENTIDOS.includes(s) ? s : 'ROTA';
  }

  const MINUSCULAS = ['DA', 'DE', 'DO', 'DAS', 'DOS', 'E'];
  function titulo(t) {
    return String(t || '').toLowerCase().split(' ').filter(Boolean)
      .map((w, i) => i > 0 && MINUSCULAS.includes(w.toUpperCase()) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  }
  const SENT_ABREV = { CHE: 'CHEGADA', CHEGADA: 'CHEGADA', SAI: 'SAÍDA', SAIDA: 'SAÍDA', 'SAÍDA': 'SAÍDA', RET: 'RETORNO', RETORNO: 'RETORNO' };

  // Padrão Univale: "M.C.O-13 - AZURITA - 084_KML_PADRAO_SEG_SEX_CHE_0655.kml"
  //   -> código "M.C.O 13", nome "Azurita", sentido CHEGADA, horário "seg a sex 06:55"
  //   vários grupos ("..._SEG_SEG_CHE_1855__SAB_DOM_CHE_0655") viram "seg a seg 18:55 / sáb a dom 06:55"
  const DIAS = { SEG: 'seg', TER: 'ter', QUA: 'qua', QUI: 'qui', SEX: 'sex', SAB: 'sáb', 'SÁB': 'sáb', DOM: 'dom' };
  function lerPadraoUnivale(s) {
    const m = s.match(/^([A-Z](?:\.[A-Z])*)\s*-?\s*(\d+)\s*-\s*(.+?)\s*-\s*\d+\s*KML\b(.*)$/);
    if (!m) return null;
    const resto = m[4].replace(/\bPADRAO\b/g, ' ');
    const sentidos = [], grupos = [];
    const re = /((?:\b(?:SEG|TER|QUA|QUI|SEX|SAB|SÁB|DOM)\b\s*)*)\b(CHE|CHEGADA|SAI|SAIDA|SAÍDA|RET|RETORNO)\b((?:\s+\d{3,4}\b)+)/g;
    let x;
    while ((x = re.exec(resto))) {
      const sent = SENT_ABREV[x[2]]; if (!sentidos.includes(sent)) sentidos.push(sent);
      const d = x[1].trim().split(/\s+/).filter(Boolean).map(t => DIAS[t]);
      const dias = d.length === 2 ? d[0] + ' a ' + d[1] : d.join(', ');
      const horas = x[3].trim().split(/\s+/).map(h => { h = h.padStart(4, '0'); return h.slice(0, 2) + ':' + h.slice(2); })
        .filter(h => +h.slice(0, 2) < 24 && +h.slice(3) < 60);
      if (horas.length) grupos.push((dias ? dias + ' ' : '') + horas.join(' e '));
    }
    return { codigo: m[1] + ' ' + m[2], nome: titulo(m[3]), sentido: sentidos[0] || 'ROTA', horario: grupos.join(' / ') };
  }


  // "MC-02 SANTANENSE CHEGADA 06-55.kml" -> código, nome, sentido, horário
  function lerNomeArquivo(nomeArquivo) {
    const s = String(nomeArquivo || '').replace(/\.km[lz]$/i, '').replace(/_/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
    const padrao = lerPadraoUnivale(s);
    if (padrao) return padrao;
    const m = s.match(/^(\S+)\s*(.*?)\s*(?:\b(SA[IÍ]DA|CHEGADA|RETORNO)\b)?\s*(\d{1,2})[-:hH.](\d{2})$/);
    if (m) return { codigo: m[1], nome: titulo(m[2].trim()), sentido: normSentido(m[3]), horario: m[4].padStart(2, '0') + ':' + m[5] };
    const g = s.match(/^(\S+)\s*(.*)$/) || [];
    const sent = (s.match(/\b(SA[IÍ]DA|CHEGADA|RETORNO)\b/) || [])[1];
    return { codigo: g[1] || s, nome: titulo((g[2] || '').replace(/\b(SA[IÍ]DA|CHEGADA|RETORNO)\b/, '').trim()), sentido: normSentido(sent), horario: '' };
  }


  function lerTuplas(txt) {
    return String(txt).trim().split(/\s+/).map(t => t.split(',').map(Number))
      .filter(p => p.length >= 2 && isFinite(p[0]) && isFinite(p[1]) && Math.abs(p[1]) <= 90 && Math.abs(p[0]) <= 180)
      .map(p => [p[1], p[0]]);
  }

  // Lê o KML por texto (os KMLs da telemetria usam prefixo gx: sem declaração, o que quebra o leitor XML)
  function lerKml(texto, nomeArquivo) {
    const info = lerNomeArquivo(nomeArquivo);
    let pontos = [], tempoMin = null, tempoMax = null;

    const placemarks = texto.match(/<Placemark[\s\S]*?<\/Placemark>/gi) || [];
    const comHora = [];
    placemarks.forEach((p, ordem) => {
      const pt = p.match(/<Point[\s\S]*?<coordinates>([\s\S]*?)<\/coordinates>/i); if (!pt) return;
      const c = lerTuplas(pt[1])[0]; if (!c) return;
      let t = null;
      const dh = p.match(/DataHora:?\s*(?:<\/strong>)?\s*(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})(?::(\d{2}))?/i);
      if (dh) t = new Date(+dh[3], dh[2] - 1, +dh[1], +dh[4], +dh[5], +(dh[6] || 0)).getTime();
      else { const w = p.match(/<when>([^<]+)<\/when>/i); if (w && !isNaN(Date.parse(w[1]))) t = Date.parse(w[1]); }
      comHora.push({ c, t, ordem });
    });

    const temposValidos = comHora.filter(x => x.t != null);
    if (temposValidos.length >= 2) {
      temposValidos.sort((a, b) => a.t - b.t || a.ordem - b.ordem);
      pontos = temposValidos.map(x => x.c);
      tempoMin = temposValidos[0].t; tempoMax = temposValidos[temposValidos.length - 1].t;
    } else {
      // KML comum: usa a maior linha (LineString) ou trilha gx:Track
      let melhor = [];
      (texto.match(/<LineString[\s\S]*?<\/LineString>/gi) || []).forEach(ls => {
        const m = ls.match(/<coordinates>([\s\S]*?)<\/coordinates>/i); const c = m ? lerTuplas(m[1]) : [];
        if (c.length > melhor.length) melhor = c;
      });
      const track = (texto.match(/<gx:coord>([^<]+)<\/gx:coord>/gi) || []).map(s => s.replace(/<\/?gx:coord>/gi, '').trim().split(/\s+/).map(Number)).filter(p => isFinite(p[0]) && isFinite(p[1])).map(p => [p[1], p[0]]);
      if (track.length > melhor.length) melhor = track;
      pontos = melhor.length >= 2 ? melhor : comHora.map(x => x.c);
    }
    if (pontos.length < 2) throw new Error('Nenhum trajeto encontrado no arquivo.');

    const registros = pontos.length;
    let coords = [];
    pontos.forEach(([la, lo]) => {
      const p = [Math.round(la * 1e5) / 1e5, Math.round(lo * 1e5) / 1e5];
      const u = coords[coords.length - 1];
      if (!u || u[0] !== p[0] || u[1] !== p[1]) coords.push(p);
    });
    const distancia = Math.round(comprimento(coords) * 10) / 10;
    let trajeto = codificar(coords), tol = 0.00002;
    while (trajeto.length > 45000 && tol < 0.01) { coords = simplificar(coords, tol); trajeto = codificar(coords); tol *= 2; }

    const d = tempoMin ? new Date(tempoMin) : null;
    return {
      codigo: info.codigo, nome: info.nome, sentido: info.sentido, horario: info.horario,
      distancia, minutos: tempoMin ? Math.round((tempoMax - tempoMin) / 60000) : 0,
      data: d ? [d.getDate(), d.getMonth() + 1].map(n => String(n).padStart(2, '0')).join('/') + '/' + d.getFullYear() : '',
      registros, trajeto, coords
    };
  }

  // Padrão de nome: "M.C.O 13 - Azurita - chegada - 06:55"
  function rotulo(r) {
    return [r.codigo, r.nome, r.sentido !== 'ROTA' ? r.sentido.toLowerCase() : '', r.horario].filter(Boolean).join(' - ');
  }

  function fmtKm(n) { return Number(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' km'; }
  function fmtMin(n) { n = Number(n || 0); return n >= 60 ? Math.floor(n / 60) + 'h' + (n % 60 ? ' ' + n % 60 + 'min' : '') : n + ' min'; }
  function chave(r) { return [String(r.codigo).toUpperCase(), r.sentido, r.horario].join('|'); }

  return { SENTIDOS, codificar, decodificar, comprimento, lerKml, lerNomeArquivo, rotulo, fmtKm, fmtMin, chave };
})();

/* Mapa base compartilhado */
function criarMapa(idMapa, idErro, botoes) {
  const map = L.map(idMapa, { zoomControl: true, preferCanvas: true });
  const ESTILOS = {
    satellite: { u: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', o: { maxZoom: 18, attribution: 'Tiles &copy; Esri' } },
    streets: { u: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', o: { maxZoom: 19, attribution: 'Tiles &copy; Esri' } }
  };
  let base = null;
  function estilo(nome) {
    const def = ESTILOS[nome] || ESTILOS.satellite; if (base) map.removeLayer(base);
    let ok = false, erros = 0; base = L.tileLayer(def.u, def.o);
    base.on('tileload', () => { ok = true; const e = document.getElementById(idErro); if (e) e.hidden = true; });
    base.on('tileerror', () => { erros++; const e = document.getElementById(idErro); if (!ok && erros > 8 && e) e.hidden = false; });
    base.addTo(map);
    if (botoes) { document.getElementById(botoes.sat).classList.toggle('active', nome === 'satellite'); document.getElementById(botoes.rua).classList.toggle('active', nome === 'streets'); }
  }
  estilo('satellite');
  if (botoes) {
    document.getElementById(botoes.sat).addEventListener('click', () => estilo('satellite'));
    document.getElementById(botoes.rua).addEventListener('click', () => estilo('streets'));
  }
  const camada = L.layerGroup().addTo(map); let linha = null;
  map.setView([-20.08, -44.58], 12);
  return {
    map,
    desenhar(c) {
      camada.clearLayers(); linha = null; if (!c || c.length < 2) return;
      L.polyline(c, { color: 'white', weight: 8, opacity: .92, lineCap: 'round', lineJoin: 'round' }).addTo(camada);
      linha = L.polyline(c, { color: '#00a49e', weight: 4, opacity: 1, lineCap: 'round', lineJoin: 'round' }).addTo(camada);
      const chip = { permanent: true, direction: 'top', offset: [0, -8], className: 'route-chip' };
      L.circleMarker(c[0], { radius: 8, color: '#fff', weight: 3, fillColor: '#11b8a6', fillOpacity: 1 }).addTo(camada).bindTooltip('Início', chip);
      L.circleMarker(c[c.length - 1], { radius: 8, color: '#fff', weight: 3, fillColor: '#ef6672', fillOpacity: 1 }).addTo(camada).bindTooltip('Fim', chip);
      this.enquadrar();
    },
    limpar() { camada.clearLayers(); linha = null; },
    enquadrar() { if (linha) map.fitBounds(linha.getBounds(), { padding: [45, 45], maxZoom: 15 }); }
  };
}
</script>
<script>
function iniciarApresentacao(routes) {
const el = id => document.getElementById(id);
const select = el('route');
const coordsCache = {};
const coordsDe = r => coordsCache[r.id] || (coordsCache[r.id] = Rotas.decodificar(r.trajeto));

routes.forEach((r, i) => select.add(new Option(Rotas.rotulo(r), i)));
iniciarFrota('fleet-backdrop');

const mapa = criarMapa('map', 'map-error', { sat: 'map-satellite', rua: 'map-streets' });

function show(i) {
  const r = routes[i]; if (!r) return;
  select.value = i;
  const sentido = r.sentido !== 'ROTA' ? r.sentido : 'Rota';
  el('route-code').textContent = r.codigo;
  el('route-name').textContent = r.nome || '';
  el('route-direction').textContent = sentido;
  el('route-time').textContent = r.horario || '--:--';
  el('distance').textContent = Rotas.fmtKm(r.distancia);
  el('map-title').textContent = [r.codigo, r.nome].filter(Boolean).join(' · ');
  el('map-subtitle').textContent = [sentido, r.horario].filter(Boolean).join(' · ');
  mapa.desenhar(coordsDe(r));
}

select.addEventListener('change', () => show(Number(select.value)));
window.addEventListener('resize', () => setTimeout(() => mapa.map.invalidateSize(), 80));
if (routes.length) {
  show(0);
} else {
  el('empty-state').hidden = false; el('route-name').textContent = 'Nenhuma rota cadastrada';
  select.add(new Option('Nenhuma rota disponível', '')); select.disabled = true;
}
setTimeout(() => { mapa.map.invalidateSize(); mapa.enquadrar(); }, 160);
}

function iniciarEditor(DADOS) {
let rotas = DADOS.rotas || [];
let fila = [];            // itens importados ainda não salvos
let selecionada = null;   // id da rota destacada na tabela
let seq = 0;
const el = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

el('who').textContent = DADOS.email || '';
el('ver-apresentacao').href = DADOS.urlApresentacao || '#';
el('sair').addEventListener('click', sairEditor);
const mapa = criarMapa('map', 'map-error', { sat: 'map-satellite', rua: 'map-streets' });
window.addEventListener('resize', () => setTimeout(() => mapa.map.invalidateSize(), 80));
setTimeout(() => mapa.map.invalidateSize(), 160);

/* ---------- servidor */
function chamar(fn, arg) {
  return fn === 'salvarRotas' ? apiEditor({ acao: 'salvar', rotas: arg }) : apiEditor({ acao: 'excluir', id: arg });
}
function ocupado(txt) {
  const d = document.createElement('div'); d.className = 'busy'; d.textContent = txt || 'Salvando...';
  document.body.appendChild(d); return () => d.remove();
}
function aviso(txt, erro) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast' + (erro ? ' err' : ''); t.textContent = txt;
  document.body.appendChild(t); setTimeout(() => t.remove(), erro ? 6500 : 3800);
}
const msgErro = e => (e && e.message ? e.message : String(e)).replace(/^(Exception|Error):\s*/, '');

/* ---------- mapa */
function mostrarNoMapa(r, coords) {
  mapa.desenhar(coords || Rotas.decodificar(r.trajeto));
  el('map-title').textContent = [r.codigo, r.nome].filter(Boolean).join(' · ') || 'Rota';
  el('map-subtitle').textContent = [r.sentido !== 'ROTA' ? r.sentido : '', r.horario, Rotas.fmtKm(r.distancia)].filter(Boolean).join(' · ');
}

/* ---------- importação */
const drop = el('drop');
el('arquivos').addEventListener('change', e => { importar(e.target.files); e.target.value = ''; });
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => importar(e.dataTransfer.files));

function lerArquivo(f) { return new Promise((ok, falha) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => falha(r.error); r.readAsText(f); }); }

async function importar(files) {
  const lista = [...(files || [])].filter(f => /\.kml$/i.test(f.name));
  if (!lista.length) { aviso('Selecione arquivos .kml', true); return; }
  for (const f of lista) {
    const item = { uid: ++seq, arquivo: f.name };
    try { Object.assign(item, Rotas.lerKml(await lerArquivo(f), f.name)); }
    catch (e) { item.erro = msgErro(e); }
    fila.push(item);
  }
  atualizarDuplicadas();
  renderFila();
  const ultimo = [...fila].reverse().find(i => !i.erro);
  if (ultimo) mostrarNoMapa(ultimo, ultimo.coords);
}

function atualizarDuplicadas() {
  const existentes = {}; rotas.forEach(r => existentes[Rotas.chave(r)] = r);
  const naFila = {}; fila.forEach(i => { if (!i.erro) naFila[Rotas.chave(i)] = (naFila[Rotas.chave(i)] || 0) + 1; });
  fila.forEach(i => {
    if (i.erro) return;
    i.dupFila = naFila[Rotas.chave(i)] > 1;
    const ex = existentes[Rotas.chave(i)];
    i.existente = ex ? ex.id : null;
    if (i.substituir == null) i.substituir = true;
  });
}

function renderFila() {
  const box = el('fila');
  el('fila-titulo').textContent = fila.length ? `Fila de importação (${fila.length})` : 'Fila de importação';
  const validos = fila.filter(i => !i.erro).length;
  el('salvar-fila').disabled = !validos;
  el('salvar-fila').textContent = validos ? `Salvar ${validos} rota${validos > 1 ? 's' : ''}` : 'Salvar rotas';
  if (!fila.length) { box.innerHTML = '<div class="queue-empty">Nenhum arquivo na fila. As rotas importadas aparecem aqui para conferência antes de salvar.</div>'; return; }
  box.innerHTML = fila.map(i => i.erro ? `
    <div class="qitem err" data-uid="${i.uid}"><div class="file">${esc(i.arquivo)}</div><div class="msg">${esc(i.erro)}</div>
      <div class="row-actions"><button class="btn btn-light btn-sm" data-acao="remover">Remover</button></div></div>` : `
    <div class="qitem" data-uid="${i.uid}">
      <div class="file">${esc(i.arquivo)}</div>
      <div class="fields">
        <div class="field"><label>Código</label><input data-campo="codigo" value="${esc(i.codigo)}"></div>
        <div class="field"><label>Dias / horário</label><input data-campo="horario" value="${esc(i.horario)}" placeholder="seg a sex 06:55" maxlength="80"></div>
        <div class="field full"><label>Nome</label><input data-campo="nome" value="${esc(i.nome)}"></div>
        <div class="field full"><label>Sentido</label><select data-campo="sentido">${Rotas.SENTIDOS.map(s => `<option ${s === i.sentido ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="stats">${Rotas.fmtKm(i.distancia)} · ${i.registros} pontos${i.data ? ' · coletado em ' + esc(i.data) : ''}</div>
      ${i.dupFila ? `<div class="dup">Outro arquivo desta importação gera o mesmo nome. Ajuste o nome ou horário para não se confundirem.</div>` : ''}
      ${i.existente ? `<label class="dup"><input type="checkbox" data-campo="substituir" ${i.substituir ? 'checked' : ''}> Já existe uma rota igual. Substituir a existente</label>` : ''}
      <div class="row-actions"><button class="btn btn-light btn-sm" data-acao="ver">Ver no mapa</button><button class="btn btn-light btn-sm" data-acao="remover">Remover</button></div>
    </div>`).join('');
}

el('fila').addEventListener('input', e => {
  const card = e.target.closest('.qitem'); const campo = e.target.dataset.campo; if (!card || !campo) return;
  const item = fila.find(i => i.uid == card.dataset.uid); if (!item) return;
  if (campo === 'substituir') item.substituir = e.target.checked;
  else if (campo === 'minutos') item.minutos = Math.max(0, Math.round(Number(e.target.value) || 0));
  else item[campo] = e.target.value;
});
el('fila').addEventListener('change', e => {
  const campo = e.target.dataset.campo; if (!['codigo', 'sentido', 'horario'].includes(campo)) return;
  const item = fila.find(i => i.uid == e.target.closest('.qitem').dataset.uid); if (!item) return;
  if (campo === 'horario') item.horario = normalizarHorario(item.horario) || item.horario;
  const antes = !!item.existente + '|' + !!item.dupFila; atualizarDuplicadas();
  if (antes !== !!item.existente + '|' + !!item.dupFila || campo === 'horario') renderFila();
});
el('fila').addEventListener('click', e => {
  const b = e.target.closest('button[data-acao]'); if (!b) return;
  const uid = b.closest('.qitem').dataset.uid; const item = fila.find(i => i.uid == uid);
  if (b.dataset.acao === 'remover') { fila = fila.filter(i => i.uid != uid); renderFila(); }
  if (b.dataset.acao === 'ver' && item) mostrarNoMapa(item, item.coords);
});
el('limpar-fila').addEventListener('click', () => { fila = []; renderFila(); });

function normalizarHorario(h) {
  // Aceita só horários ("6:55", "06:55 / 18:55") ou dias + horários ("seg a sex 06:55 / sáb a dom 07:20")
  const t = String(h || '').trim().replace(/\s+/g, ' ').toLowerCase();
  if (!t) return '';
  const partes = t.split(/\s*\/\s*/);
  const out = [];
  for (const p of partes) {
    const m = p.match(/^((?:[a-zçáéíóúâêôãõ]+[ ,]*?)*?)\s*((?:\d{1,2}[:h.]?\d{2})(?:\s*(?:e|,)\s*\d{1,2}[:h.]?\d{2})*)$/);
    if (!m) return '';
    const horas = m[2].split(/\s*(?:e|,)\s*/).map(x => { const k = x.match(/^(\d{1,2})[:h.]?(\d{2})$/); return k && +k[1] < 24 && +k[2] < 60 ? k[1].padStart(2, '0') + ':' + k[2] : null; });
    if (horas.includes(null)) return '';
    out.push(((m[1] || '').trim() ? m[1].trim() + ' ' : '') + horas.join(' e '));
  }
  return out.join(' / ').slice(0, 80);
}
function paraEnvio(i) {
  return { id: i.existente && i.substituir ? i.existente : '', codigo: String(i.codigo || '').trim(), nome: String(i.nome || '').trim(),
    sentido: i.sentido, horario: normalizarHorario(i.horario), distancia: i.distancia, minutos: i.minutos,
    data: i.data, registros: i.registros, trajeto: i.trajeto };
}

el('salvar-fila').addEventListener('click', async () => {
  const validos = fila.filter(i => !i.erro);
  const semCodigo = validos.find(i => !String(i.codigo || '').trim());
  if (semCodigo) { aviso('Preencha o código de todas as rotas antes de salvar.', true); return; }
  const fim = ocupado('Salvando rotas...');
  try {
    let resultado = rotas;
    for (let k = 0; k < validos.length; k += 25) resultado = await chamar('salvarRotas', validos.slice(k, k + 25).map(paraEnvio));
    rotas = resultado;
    fila = fila.filter(i => i.erro);
    renderFila(); renderTabela();
    aviso(`${validos.length} rota${validos.length > 1 ? 's salvas' : ' salva'}. A apresentação já mostra as alterações.`);
  } catch (e) { aviso('Não foi possível salvar: ' + msgErro(e), true); }
  finally { fim(); }
});

/* ---------- rotas salvas */
el('busca').addEventListener('input', renderTabela);
function renderTabela() {
  const q = el('busca').value.trim().toLowerCase();
  const lista = rotas.filter(r => !q || [r.codigo, r.nome, r.sentido, r.horario].join(' ').toLowerCase().includes(q));
  el('lista-titulo').textContent = `Rotas salvas (${rotas.length})`;
  el('tabela').innerHTML = lista.length ? lista.map(r => `
    <tr data-id="${esc(r.id)}" class="${r.id === selecionada ? 'sel' : ''}">
      <td><b>${esc(r.codigo)}</b></td><td class="nome">${esc(r.nome)}</td><td><span class="tag">${esc(r.sentido)}</span></td><td>${esc(r.horario || '—')}</td>
      <td class="num">${Rotas.fmtKm(r.distancia)}</td>
      <td class="muted">${esc(r.atualizado || '')}</td>
      <td class="acoes"><button class="btn btn-light btn-sm" data-acao="ver">Ver</button><button class="btn btn-light btn-sm" data-acao="editar">Editar</button><button class="btn btn-danger btn-sm" data-acao="excluir">Excluir</button></td>
    </tr>`).join('') : `<tr><td colspan="7" class="muted" style="padding:18px">${rotas.length ? 'Nenhuma rota encontrada para a busca.' : 'Nenhuma rota salva ainda. Importe arquivos KML ao lado.'}</td></tr>`;
}
el('tabela').addEventListener('click', e => {
  const b = e.target.closest('button[data-acao]'); const tr = e.target.closest('tr[data-id]'); if (!tr) return;
  const r = rotas.find(x => x.id === tr.dataset.id); if (!r) return;
  selecionada = r.id;
  if (!b || b.dataset.acao === 'ver') { mostrarNoMapa(r); renderTabela(); }
  else if (b.dataset.acao === 'editar') abrirEdicao(r);
  else if (b.dataset.acao === 'excluir') confirmarExclusao(r);
});

/* ---------- modais */
function modal(html) {
  const root = el('modal-root'); root.innerHTML = `<div class="modal-bg"><div class="modal">${html}</div></div>`;
  const bg = root.firstElementChild; bg.addEventListener('mousedown', e => { if (e.target === bg) fechar(); });
  return root.querySelector('.modal');
}
function fechar() { el('modal-root').innerHTML = ''; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });

function abrirEdicao(r) {
  let novo = null;
  const m = modal(`
    <h3>Editar rota</h3>
    <div class="fields">
      <div class="field"><label>Código</label><input id="e-codigo" value="${esc(r.codigo)}"></div>
      <div class="field"><label>Dias / horário</label><input id="e-horario" value="${esc(r.horario)}" placeholder="seg a sex 06:55" maxlength="80"></div>
      <div class="field full"><label>Nome</label><input id="e-nome" value="${esc(r.nome)}"></div>
      <div class="field"><label>Sentido</label><select id="e-sentido">${Rotas.SENTIDOS.map(s => `<option ${s === r.sentido ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="field"><label>Distância (km)</label><input id="e-distancia" type="number" min="0" step="0.1" value="${esc(r.distancia)}"></div>
      <div class="field"><label>Trajeto</label><label class="btn btn-light btn-sm" style="display:grid;place-items:center;height:32px">Trocar por novo KML<input id="e-kml" type="file" accept=".kml" hidden></label></div>
    </div>
    <p id="e-info" class="muted">Trajeto atual: ${r.registros} pontos${r.data ? ', coletado em ' + esc(r.data) : ''}.</p>
    <div class="acts"><button class="btn btn-light" id="e-cancelar">Cancelar</button><button class="btn btn-primary" id="e-salvar">Salvar alterações</button></div>`);
  m.querySelector('#e-cancelar').onclick = fechar;
  m.querySelector('#e-kml').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      novo = Rotas.lerKml(await lerArquivo(f), f.name);
      m.querySelector('#e-distancia').value = novo.distancia;
      m.querySelector('#e-info').textContent = `Novo trajeto: ${f.name} (${novo.registros} pontos, ${Rotas.fmtKm(novo.distancia)}). Será aplicado ao salvar.`;
      mostrarNoMapa({ ...r, ...novo, codigo: r.codigo, nome: r.nome, sentido: r.sentido, horario: r.horario }, novo.coords);
    } catch (err) { novo = null; aviso('KML inválido: ' + msgErro(err), true); }
  };
  m.querySelector('#e-salvar').onclick = async () => {
    const dados = {
      id: r.id, codigo: m.querySelector('#e-codigo').value.trim(), nome: m.querySelector('#e-nome').value.trim(),
      sentido: m.querySelector('#e-sentido').value, horario: normalizarHorario(m.querySelector('#e-horario').value),
      minutos: novo ? novo.minutos : r.minutos,
      distancia: Math.max(0, Number(m.querySelector('#e-distancia').value) || 0),
      data: novo ? (novo.data || r.data) : r.data, registros: novo ? novo.registros : r.registros,
      trajeto: novo ? novo.trajeto : r.trajeto
    };
    if (!dados.codigo) { aviso('O código é obrigatório.', true); return; }
    if (m.querySelector('#e-horario').value.trim() && !dados.horario) { aviso('Dias / horário inválido. Ex.: 06:55, seg a sex 06:55 ou seg a seg 18:55 / sáb a dom 06:55.', true); return; }
    const fim = ocupado();
    try { rotas = await chamar('salvarRotas', [dados]); fechar(); renderTabela(); const atual = rotas.find(x => x.id === r.id); if (atual) mostrarNoMapa(atual); aviso('Rota atualizada.'); }
    catch (e) { aviso('Não foi possível salvar: ' + msgErro(e), true); }
    finally { fim(); }
  };
}

function confirmarExclusao(r) {
  const m = modal(`<h3>Excluir rota?</h3><p><b>${esc(Rotas.rotulo(r))}</b> será removida da apresentação. Esta ação não pode ser desfeita.</p>
    <div class="acts"><button class="btn btn-light" id="x-cancelar">Cancelar</button><button class="btn btn-danger" id="x-ok">Excluir</button></div>`);
  m.querySelector('#x-cancelar').onclick = fechar;
  m.querySelector('#x-ok').onclick = async () => {
    const fim = ocupado('Excluindo...');
    try { rotas = await chamar('excluirRota', r.id); fechar(); if (selecionada === r.id) { selecionada = null; mapa.limpar(); el('map-title').textContent = 'Pré-visualização'; el('map-subtitle').textContent = 'Clique em "Ver" em uma rota para mostrar no mapa'; } renderTabela(); aviso('Rota excluída.'); }
    catch (e) { aviso('Não foi possível excluir: ' + msgErro(e), true); }
    finally { fim(); }
  };
}

renderFila();
renderTabela();
if (rotas[0]) { selecionada = rotas[0].id; mostrarNoMapa(rotas[0]); renderTabela(); }

/* ---------- conta, abas e administração */
const EU = DADOS.usuario;
const ehAdmin = EU.perfil === 'ADMIN';
document.querySelectorAll('.so-admin').forEach(b => b.hidden = !ehAdmin);
el('minha-senha').addEventListener('click', modalMinhaSenha);

let usuarios = [], logs = [], abaAtual = 'rotas';
el('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) trocarAba(b.dataset.tab); });
function trocarAba(aba) {
  abaAtual = aba;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === aba));
  el('ed-rotas').hidden = aba !== 'rotas';
  el('painel-usuarios').hidden = aba !== 'usuarios';
  el('painel-log').hidden = aba !== 'log';
  if (aba === 'rotas') setTimeout(() => mapa.map.invalidateSize(), 60);
  if (aba === 'usuarios') carregarUsuarios();
  if (aba === 'log') carregarLog();
}

function campoSenhaOk(a, b) {
  if (String(a).length < 8) return 'A senha precisa ter pelo menos 8 caracteres.';
  if (a !== b) return 'As senhas não conferem.';
  return '';
}

function modalMinhaSenha() {
  const m = modal(`<h3>Trocar minha senha</h3>
    <div class="fields">
      <div class="field full"><label>Senha atual</label><input id="m-atual" type="password" autocomplete="current-password"></div>
      <div class="field"><label>Nova senha</label><input id="m-nova" type="password" autocomplete="new-password"></div>
      <div class="field"><label>Confirme</label><input id="m-conf" type="password" autocomplete="new-password"></div>
    </div>
    <div class="acts"><button class="btn btn-light" id="m-cancelar">Cancelar</button><button class="btn btn-primary" id="m-ok">Salvar</button></div>`);
  m.querySelector('#m-cancelar').onclick = fechar;
  m.querySelector('#m-ok').onclick = async () => {
    const nova = m.querySelector('#m-nova').value, erro = campoSenhaOk(nova, m.querySelector('#m-conf').value);
    if (erro) { aviso(erro, true); return; }
    const fim = ocupado();
    try { await apiEditor({ acao: 'trocarSenha', senhaAtual: m.querySelector('#m-atual').value, novaSenha: nova }); fechar(); aviso('Senha alterada.'); }
    catch (e) { aviso(msgErro(e), true); } finally { fim(); }
  };
}

/* usuários */
el('usu-busca').addEventListener('input', renderUsuarios);
el('usu-novo').addEventListener('click', () => modalUsuario(null));
async function carregarUsuarios() {
  const fim = ocupado('Carregando usuários...');
  try { usuarios = await apiEditor({ acao: 'usuarios' }); renderUsuarios(); }
  catch (e) { aviso(msgErro(e), true); } finally { fim(); }
}
function renderUsuarios() {
  const q = el('usu-busca').value.trim().toLowerCase();
  const lista = usuarios.filter(u => !q || (u.nome + ' ' + u.login).toLowerCase().includes(q));
  el('usu-titulo').textContent = `Usuários (${usuarios.length})`;
  el('usu-tabela').innerHTML = lista.length ? lista.map(u => `
    <tr data-id="${esc(u.id)}">
      <td><b>${esc(u.nome)}</b>${u.id === EU.id ? ' <span class="muted">(você)</span>' : ''}</td><td>${esc(u.login)}</td>
      <td><span class="tag ${u.perfil === 'ADMIN' ? 'adm' : ''}">${esc(u.perfil)}</span></td>
      <td><span class="tag ${u.ativo ? 'on' : 'off'}">${u.ativo ? 'Ativo' : 'Inativo'}</span>${u.trocarSenha ? ' <span class="muted">senha provisória</span>' : ''}</td>
      <td class="muted">${esc(u.ultimoAcesso || '—')}</td>
      <td class="acoes"><button class="btn btn-light btn-sm" data-acao="editar">Editar</button><button class="btn btn-light btn-sm" data-acao="senha">Redefinir senha</button>${u.id === EU.id ? '' : '<button class="btn btn-danger btn-sm" data-acao="excluir">Excluir</button>'}</td>
    </tr>`).join('') : '<tr><td colspan="6" class="muted" style="padding:18px">Nenhum usuário encontrado.</td></tr>';
}
el('usu-tabela').addEventListener('click', e => {
  const b = e.target.closest('button[data-acao]'); if (!b) return;
  const u = usuarios.find(x => x.id === b.closest('tr').dataset.id); if (!u) return;
  if (b.dataset.acao === 'editar') modalUsuario(u);
  if (b.dataset.acao === 'senha') modalRedefinir(u);
  if (b.dataset.acao === 'excluir') confirmarExclusaoUsuario(u);
});
async function enviarUsuario(dados, msg) {
  const fim = ocupado();
  try { usuarios = await apiEditor({ acao: 'salvarUsuario', usuario: dados }); fechar(); renderUsuarios(); aviso(msg); }
  catch (e) { aviso(msgErro(e), true); } finally { fim(); }
}
function modalUsuario(u) {
  const novo = !u; u = u || { nome: '', login: '', perfil: 'EDITOR', ativo: true };
  const m = modal(`<h3>${novo ? 'Novo usuário' : 'Editar usuário'}</h3>
    <div class="fields">
      <div class="field full"><label>Nome</label><input id="u-nome" value="${esc(u.nome)}" maxlength="80"></div>
      <div class="field full"><label>E-mail (login)</label><input id="u-login" type="email" value="${esc(u.login)}" maxlength="120"></div>
      <div class="field"><label>Perfil</label><select id="u-perfil"><option value="EDITOR" ${u.perfil === 'EDITOR' ? 'selected' : ''}>EDITOR — rotas</option><option value="ADMIN" ${u.perfil === 'ADMIN' ? 'selected' : ''}>ADMIN — rotas, usuários e histórico</option></select></div>
      ${novo ? '<div class="field"><label>Senha provisória</label><input id="u-senha" type="text" autocomplete="off" placeholder="Mínimo de 8 caracteres"></div>'
             : `<div class="field"><label>Situação</label><label class="check" style="height:32px"><input id="u-ativo" type="checkbox" ${u.ativo ? 'checked' : ''}> Ativo</label></div>`}
    </div>
    <p class="muted">${novo ? 'Passe a senha provisória para a pessoa. Ela será obrigada a trocar no primeiro acesso.' : 'Usuário inativo não consegue entrar, mas continua aparecendo no histórico.'}</p>
    <div class="acts"><button class="btn btn-light" id="u-cancelar">Cancelar</button><button class="btn btn-primary" id="u-ok">${novo ? 'Cadastrar' : 'Salvar'}</button></div>`);
  m.querySelector('#u-cancelar').onclick = fechar;
  m.querySelector('#u-ok').onclick = () => {
    const dados = { id: u.id || '', nome: m.querySelector('#u-nome').value.trim(), login: m.querySelector('#u-login').value.trim(),
      perfil: m.querySelector('#u-perfil').value, ativo: novo ? true : m.querySelector('#u-ativo').checked };
    if (!dados.nome || !dados.login) { aviso('Preencha nome e e-mail.', true); return; }
    if (novo) { dados.senha = m.querySelector('#u-senha').value; if (dados.senha.length < 8) { aviso('A senha provisória precisa ter pelo menos 8 caracteres.', true); return; } }
    enviarUsuario(dados, novo ? 'Usuário cadastrado.' : 'Usuário atualizado.');
  };
}
function modalRedefinir(u) {
  const m = modal(`<h3>Redefinir senha</h3><p>Defina uma senha provisória para <b>${esc(u.nome)}</b>. No próximo acesso, a pessoa terá que trocá-la.</p>
    <div class="field"><label>Senha provisória</label><input id="r-senha" type="text" autocomplete="off" placeholder="Mínimo de 8 caracteres"></div>
    <div class="acts"><button class="btn btn-light" id="r-cancelar">Cancelar</button><button class="btn btn-primary" id="r-ok">Redefinir</button></div>`);
  m.querySelector('#r-cancelar').onclick = fechar;
  m.querySelector('#r-ok').onclick = () => {
    const senha = m.querySelector('#r-senha').value;
    if (senha.length < 8) { aviso('A senha provisória precisa ter pelo menos 8 caracteres.', true); return; }
    enviarUsuario({ id: u.id, nome: u.nome, login: u.login, perfil: u.perfil, ativo: u.ativo, senha }, 'Senha redefinida.');
  };
}
function confirmarExclusaoUsuario(u) {
  const m = modal(`<h3>Excluir usuário?</h3><p><b>${esc(u.nome)}</b> (${esc(u.login)}) perderá o acesso. O que essa pessoa fez continua registrado no histórico.<br>Se for algo temporário, prefira desativar em "Editar".</p>
    <div class="acts"><button class="btn btn-light" id="xu-cancelar">Cancelar</button><button class="btn btn-danger" id="xu-ok">Excluir</button></div>`);
  m.querySelector('#xu-cancelar').onclick = fechar;
  m.querySelector('#xu-ok').onclick = async () => {
    const fim = ocupado('Excluindo...');
    try { usuarios = await apiEditor({ acao: 'excluirUsuario', id: u.id }); fechar(); renderUsuarios(); aviso('Usuário excluído.'); }
    catch (e) { aviso(msgErro(e), true); } finally { fim(); }
  };
}

/* histórico */
const ACOES = {
  LOGIN: ['Entrou', 'acesso'], LOGIN_FALHOU: ['Falha de login', 'excluir'], LOGOUT: ['Saiu', 'acesso'], TROCOU_SENHA: ['Trocou a senha', 'acesso'],
  ROTA_CRIADA: ['Criou rota', 'criar'], ROTA_ALTERADA: ['Alterou rota', 'alterar'], ROTA_EXCLUIDA: ['Excluiu rota', 'excluir'], ROTAS_IMPORTADAS: ['Importação inicial', 'criar'],
  USUARIO_CRIADO: ['Criou usuário', 'criar'], USUARIO_ALTERADO: ['Alterou usuário', 'alterar'], USUARIO_EXCLUIDO: ['Excluiu usuário', 'excluir'], SENHA_REDEFINIDA: ['Redefiniu senha', 'alterar']
};
el('log-busca').addEventListener('input', renderLog);
el('log-filtro').addEventListener('change', renderLog);
el('log-atualizar').addEventListener('click', carregarLog);
async function carregarLog() {
  const fim = ocupado('Carregando histórico...');
  try { logs = await apiEditor({ acao: 'log', limite: 1000 }); renderLog(); }
  catch (e) { aviso(msgErro(e), true); } finally { fim(); }
}
function renderLog() {
  const q = el('log-busca').value.trim().toLowerCase(), f = el('log-filtro').value;
  const re = f ? new RegExp('^(' + f + ')') : null;
  const lista = logs.filter(l => (!re || re.test(l.acao)) && (!q || [l.usuario, l.login, l.item, l.detalhes, (ACOES[l.acao] || [l.acao])[0]].join(' ').toLowerCase().includes(q)));
  el('log-titulo').textContent = `Histórico (${lista.length}${lista.length !== logs.length ? ' de ' + logs.length : ''})`;
  el('log-tabela').innerHTML = lista.length ? lista.map(l => { const a = ACOES[l.acao] || [l.acao, 'acesso']; return `
    <tr><td class="muted">${esc(l.data)}</td><td><b>${esc(l.usuario || '—')}</b><div class="muted">${esc(l.login)}</div></td>
    <td><span class="tag ${a[1]}">${esc(a[0])}</span></td><td class="nome">${esc(l.item)}</td><td class="det">${esc(l.detalhes)}</td></tr>`; }).join('')
    : '<tr><td colspan="5" class="muted" style="padding:18px">Nenhum registro encontrado.</td></tr>';
}

}

/* ===================== CONFIGURAÇÃO =====================
   Cole aqui a URL do App da Web do Apps Script (termina em /exec) */
const API_URL = 'https://script.google.com/macros/s/AKfycbzkJK_ETR1I7frkpcbmqJdqIlN3P-kq885S-MtErG6ZR0smaDw-hJKbopeXoX-VCagRLw/exec';
/* ======================================================== */

const VIEW = () => new URLSearchParams(location.search).get('view') || (location.hash === '#editor' ? 'editor' : '');
const link = v => location.pathname + (v ? '?view=' + v : '');
function destino() { return abrirEditor(); }
const SESSAO = 'univale-rotas-sessao';

function lerSessao() { try { return JSON.parse(sessionStorage.getItem(SESSAO) || 'null'); } catch (e) { return null; } }
function gravarSessao(s) { try { s ? sessionStorage.setItem(SESSAO, JSON.stringify(s)) : sessionStorage.removeItem(SESSAO); } catch (e) {} }

async function api(corpo) {
  if (!/^https:\/\/script\.google\.com\//.test(API_URL)) throw new Error('Configure a API_URL no index.html.');
  const resp = corpo
    ? await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) })
    : await fetch(API_URL + '?acao=listar');
  if (!resp.ok) throw new Error('Falha de comunicação com o Apps Script (' + resp.status + ').');
  const j = await resp.json();
  if (!j.ok) throw new Error(j.erro || 'Erro no Apps Script.');
  return j.dados;
}
async function apiEditor(corpo) {
  const s = lerSessao() || {};
  try { return await api({ ...corpo, token: s.token }); }
  catch (e) {
    if (/Sessão expirada/i.test(e.message)) { gravarSessao(null); setTimeout(() => telaLogin('Sua sessão expirou. Entre novamente.'), 1500); }
    else if (/Troque sua senha/i.test(e.message)) setTimeout(telaTrocarSenha, 1500);
    throw e;
  }
}
async function sairEditor() { try { await apiEditor({ acao: 'sair' }); } catch (e) {} gravarSessao(null); history.replaceState(null, '', link('')); telaLogin(); }
function montar(idTemplate) {
  document.querySelectorAll('.modal-bg,.busy,.toast').forEach(x => x.remove());
  const root = document.getElementById('app-root');
  root.replaceChildren(document.getElementById(idTemplate).content.cloneNode(true));
  aplicarLogos();
}
function mostrarErro(id, msg) { const e = document.getElementById(id); e.textContent = msg; e.hidden = !msg; }

function telaLogin(msg) {
  montar('tpl-login');
  const f = document.getElementById('login-form');
  mostrarErro('login-erro', msg || '');
  document.getElementById('link-apresentacao').href = link('apresentacao');
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const login = f.login.value.trim(), senha = f.senha.value;
    if (!login || !senha) return mostrarErro('login-erro', 'Informe e-mail e senha.');
    f.querySelector('button').disabled = true; mostrarErro('login-erro', '');
    try {
      const r = await api({ acao: 'login', login, senha });
      gravarSessao({ token: r.token, usuario: r.usuario });
      r.trocarSenha ? telaTrocarSenha() : destino();
    } catch (e) { mostrarErro('login-erro', e.message); f.querySelector('button').disabled = false; }
  });
}
function telaTrocarSenha() {
  montar('tpl-trocar');
  const f = document.getElementById('troca-form');
  document.getElementById('troca-sair').addEventListener('click', ev => { ev.preventDefault(); sairEditor(); });
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const atual = f.querySelector('#t-atual').value, nova = f.querySelector('#t-nova').value, conf = f.querySelector('#t-conf').value;
    if (nova.length < 8) return mostrarErro('troca-erro', 'A nova senha precisa ter pelo menos 8 caracteres.');
    if (nova !== conf) return mostrarErro('troca-erro', 'As senhas não conferem.');
    f.querySelector('button').disabled = true; mostrarErro('troca-erro', '');
    try { await apiEditor({ acao: 'trocarSenha', senhaAtual: atual, novaSenha: nova }); destino(); }
    catch (e) { mostrarErro('troca-erro', e.message); f.querySelector('button').disabled = false; }
  });
}
async function abrirEditor() {
  if (!lerSessao()) return telaLogin();
  try {
    const [eu, rotas] = await Promise.all([apiEditor({ acao: 'eu' }), api()]);
    if (eu.trocarSenha) return telaTrocarSenha();
    gravarSessao({ ...lerSessao(), usuario: eu.usuario });
    montar('tpl-editor');
    iniciarEditor({ rotas, usuario: eu.usuario, email: eu.usuario.nome + ' · ' + eu.usuario.perfil, urlApresentacao: link('apresentacao') });
    const m = document.getElementById('menu-inicio'); if (m) m.href = link('');
  } catch (e) { if (!/Sessão expirada|Troque sua senha/i.test(e.message)) telaLogin('Não foi possível abrir o editor: ' + e.message); }
}
async function abrirMenu() {
  if (!lerSessao()) return telaLogin();
  try {
    const eu = await apiEditor({ acao: 'eu' });
    if (eu.trocarSenha) return telaTrocarSenha();
    gravarSessao({ ...lerSessao(), usuario: eu.usuario });
    montar('tpl-menu');
    const u = eu.usuario;
    document.getElementById('menu-ola').textContent = 'Olá, ' + u.nome.split(' ')[0];
    document.getElementById('menu-perfil').textContent = u.login + ' · ' + u.perfil;
    (document.getElementById('menu-editor-sub')||{}).textContent = u.perfil === 'ADMIN' ? 'Importar KML, editar e excluir rotas, gerenciar usuários e ver o histórico.' : 'Importar KML, editar e excluir rotas.';
    document.getElementById('card-apresentacao').href = link('apresentacao');
    document.getElementById('card-editor').href = link('editor');
    document.getElementById('menu-sair').addEventListener('click', ev => { ev.preventDefault(); sairEditor(); });
  } catch (e) { if (!/Sessão expirada|Troque sua senha/i.test(e.message)) telaLogin('Não foi possível entrar: ' + e.message); }
}
async function abrirApresentacao() {
  montar('tpl-apresentacao');
  if (lerSessao()) {
    const nav = document.querySelector('.topbar .nav');
    const a = document.createElement('a'); a.className = 'link-btn'; a.href = link(''); a.textContent = '← Voltar ao editor'; a.style.marginLeft = '14px';
    if (nav) nav.appendChild(a);
  }
  try { iniciarApresentacao(await api()); }
  catch (e) {
    iniciarApresentacao([]);
    document.getElementById('empty-state').textContent = 'Não foi possível carregar as rotas. Tente novamente em instantes.';
  }
}
(function iniciar() {
  const v = VIEW();
  if (v === 'apresentacao') return abrirApresentacao();
  return lerSessao() ? abrirEditor() : telaLogin();
})();

</script>
